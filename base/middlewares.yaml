apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prowlarr
spec:
  stripPrefix:
    prefixes:
      - /prowlarr
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-radarr
spec:
  stripPrefix:
    prefixes:
      - /radarr
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-sonarr
spec:
  stripPrefix:
    prefixes:
      - /sonarr
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:

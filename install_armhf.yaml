apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frigate
  name: frigate
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frigate
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: frigate
    spec:
      containers:
      - command:
        - bash
        - -c
        - |
          set -e
          # RTSP login for go2rtc = camera login, kept URL-encoded (it goes into URLs).
          cred="${CAM1_URL#*://}"; cred="${cred%%@*}"
          export FRIGATE_RTSP_USER="${cred%%:*}" FRIGATE_RTSP_PASSWORD="${cred#*:}"
          unset CAM1_URL
          cp /frigate-config/config.yml /config/config.yml
          exec /init
        env:
        - name: CAM1_URL
          valueFrom:
            secretKeyRef:
              key: CAM1_URL
              name: camera-rtsp
        - name: FRIGATE_MQTT_USER
          valueFrom:
            secretKeyRef:
              key: MQTT_USER
              name: mqtt
        - name: FRIGATE_MQTT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: MQTT_PASS
              name: mqtt
        - name: YOLO_MODELS
          value: yolov7-320
        - name: TZ
          value: Europe/Lisbon
        image: ghcr.io/blakeblackshear/frigate:0.18.0-tensorrt-jp6
        name: frigate
        ports:
        - containerPort: 8971
          hostPort: 8971
          name: ui
        - containerPort: 5000
          name: api
        resources:
          limits:
            memory: 3Gi
          requests:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
        - mountPath: /frigate-config
          name: config-src
        - mountPath: /config
          name: data
          subPath: frigate/config
        - mountPath: /media/frigate
          name: data
          subPath: frigate/media
        - mountPath: /tmp/cache
          name: cache
        - mountPath: /dev/shm
          name: shm
      nodeSelector:
        kubernetes.io/hostname: jetson-orin-01
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: workload
        operator: Equal
        value: jetson
      volumes:
      - configMap:
          name: frigate
        name: config-src
      - name: data
        persistentVolumeClaim:
          claimName: jetson-ai-pvc
      - emptyDir:
          sizeLimit: 2Gi
        name: cache
      - emptyDir:
          medium: Memory
          sizeLimit: 256Mi
        name: shm
---

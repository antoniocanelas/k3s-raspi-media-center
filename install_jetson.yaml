kind: ConfigMap
metadata:
  name: frigate
  namespace: ai
---
apiVersion: v1
data:
  run.sh: |
    #!/bin/sh
    set -e
    # RTSP login = camera login (URL-decoded user:pass of CAM1_URL), written
    # as YAML single-quoted strings ('' escapes a quote).
    yq() { awk -v s="$1" 'BEGIN {
      h = "0123456789abcdef"; o = ""
      for (i = 1; i <= length(s); i++) {
        c = substr(s, i, 1)
        if (c == "%" && i + 2 <= length(s)) {
          c = sprintf("%c", (index(h, tolower(substr(s, i+1, 1))) - 1) * 16 + index(h, tolower(substr(s, i+2, 1))) - 1)
          i += 2
        }
        if (c == "\047") c = "\047\047"
        o = o c
      }
      printf "\047%s\047", o }'; }
    cred="${CAM1_URL#*://}"; cred="${cred%%@*}"
    {
      echo 'rtsp:'
      echo '  listen: ":8554"'
      echo "  username: $(yq "${cred%%:*}")"
      echo "  password: $(yq "${cred#*:}")"
      echo 'api:'
      echo '  listen: ":1984"'
      echo 'webrtc:'
      echo '  listen: ""'
      echo 'streams:'
      for u in "$CAM1_URL" "$CAM2_URL" "$CAM3_URL"; do
        [ -n "$u" ] || continue
        h="${u##*@}"; h="${h%%[:/]*}"
        printf '  cam%s: "%s#media=video"\n' "${h##*.}" "$u"
        printf '  cam%s_hd: "%s"\n' "${h##*.}" "${u%/stream2}/stream1"
      done
    } > /tmp/go2rtc.yaml
    exec go2rtc -config /tmp/go2rtc.yaml
kind: ConfigMap
metadata:
  name: go2rtc
  namespace: ai
---
apiVersion: v1
data:
  monitor.py: |
    import glob
    import json
    import os
    import socket
    import struct
    import time
    import urllib.request

    HOST = os.environ.get("MQTT_HOST", "192.168.0.100")
    PORT = int(os.environ.get("MQTT_PORT", "1883"))
    USER, PASS = os.environ.get("MQTT_USER", ""), os.environ.get("MQTT_PASS", "")
    LLM = os.environ.get("LLM_URL", "http://llm.ai.svc.cluster.local:8080")
    FRIGATE = os.environ.get("FRIGATE_URL", "http://frigate.ai.svc.cluster.local:5000")
    STATE = "jetson/monitor/state"
    DEVICE = {"identifiers": ["jetson-orin-01"], "name": "Jetson Orin Nano",
              "manufacturer": "NVIDIA / Waveshare", "model": "Orin Nano 8GB (JetPack 6.2)"}


    def _s(v):
        b = v.encode()
        return struct.pack("!H", len(b)) + b


    def _len(n):
        out = b""
        while True:
            d, n = n % 128, n // 128
            out += bytes([d | (0x80 if n else 0)])
            if not n:
                return out


    def publish(msgs):
        """Publish [(topic, payload, retain)] over one MQTT 3.1.1 connection."""
        flags = 0x02 | (0x80 if USER else 0) | (0x40 if PASS else 0)
        conn = _s("MQTT") + bytes([4, flags]) + struct.pack("!H", 60) + _s("jetson-monitor")
        if USER:
            conn += _s(USER)
        if PASS:
            conn += _s(PASS)
        with socket.create_connection((HOST, PORT), timeout=10) as c:
            c.sendall(bytes([0x10]) + _len(len(conn)) + conn)
            ack = c.recv(4)
            if len(ack) < 4 or ack[3] != 0:
                raise OSError(f"CONNACK {list(ack)}")
            for topic, payload, retain in msgs:
                body = _s(topic) + payload.encode()
                c.sendall(bytes([0x31 if retain else 0x30]) + _len(len(body)) + body)
            c.sendall(bytes([0xE0, 0]))


    def discovery():
        def sensor(key, name, comp="sensor", **extra):
            cfg = {"name": name, "unique_id": f"jetson_orin_{key}",
                   "default_entity_id": f"{comp}.jetson_{key}", "state_topic": STATE,
                   "value_template": "{{ value_json.%s }}" % key, "expire_after": 120,
                   "device": DEVICE, **extra}
            return (f"homeassistant/{comp}/jetson_orin/{key}/config", json.dumps(cfg), True)
        msgs = [
            sensor("temperature", "Temperatura", unit_of_measurement="°C",
                   device_class="temperature", state_class="measurement"),
            sensor("ram_used", "RAM usada", unit_of_measurement="%", state_class="measurement",
                   icon="mdi:memory"),
            sensor("ram_available", "RAM disponível", unit_of_measurement="MB",
                   state_class="measurement", icon="mdi:memory"),
            sensor("gpu_load", "Carga GPU", unit_of_measurement="%", state_class="measurement",
                   icon="mdi:expansion-card"),
            sensor("cpu_load", "Carga CPU", unit_of_measurement="%", state_class="measurement",
                   icon="mdi:cpu-64-bit"),
            sensor("llm_model", "Modelo LLM carregado", icon="mdi:brain"),
            # Face attempts in Frigate's Train tab (Faces > Recent recognitions).
            sensor("faces_pending", "Caras por classificar", state_class="measurement",
                   icon="mdi:face-recognition"),
            sensor("llm_online", "LLM", comp="binary_sensor", device_class="connectivity",
                   payload_on="on", payload_off="off"),
        ]
        # Per-camera fps from Frigate's stats (published every 60 s).
        for cam in ("cam60", "cam62", "cam63"):
            cfg = {"name": f"FPS {cam}", "unique_id": f"jetson_orin_fps_{cam}",
                   "default_entity_id": f"sensor.jetson_fps_{cam}",
                   "state_topic": "frigate/stats",
                   "value_template": "{{ value_json.cameras.%s.camera_fps | default(0) }}" % cam,
                   "unit_of_measurement": "fps", "state_class": "measurement",
                   "icon": "mdi:cctv", "expire_after": 180, "device": DEVICE}
            msgs.append((f"homeassistant/sensor/jetson_orin/fps_{cam}/config", json.dumps(cfg), True))
        cfg = {"name": "Inferência Frigate", "unique_id": "jetson_orin_frigate_inference",
               "default_entity_id": "sensor.jetson_frigate_inference",
               "state_topic": "frigate/stats",
               "value_template": "{{ (value_json.detectors.onnx or value_json.detectors.tensorrt).inference_speed | default(0) }}",
               "unit_of_measurement": "ms", "state_class": "measurement",
               "icon": "mdi:timer-outline", "expire_after": 180, "device": DEVICE}
        msgs.append(("homeassistant/sensor/jetson_orin/frigate_inference/config", json.dumps(cfg), True))
        return msgs


    def read(path, default=None):
        # Some Orin thermal zones (cv0-2) fail on read (EAGAIN surfaces as a
        # TypeError from the decoder), so treat any error as "no value".
        try:
            with open(path) as f:
                return f.read().strip()
        except Exception:
            return default


    def cpu_times():
        # Aggregate "cpu" line of /proc/stat: (idle + iowait, total) in jiffies.
        f = [int(x) for x in open("/proc/stat").readline().split()[1:]]
        return f[3] + f[4], sum(f)


    def state(gpu_avg, cpu_pct):
        temps = {}
        for z in glob.glob("/sys/devices/virtual/thermal/thermal_zone*"):
            t = read(f"{z}/temp")
            if t and t.lstrip("-").isdigit():
                temps[read(f"{z}/type", z)] = int(t) / 1000
        mem = {}
        for line in open("/proc/meminfo"):
            k, v = line.split(":")
            mem[k] = int(v.split()[0])
        st = {
            "temperature": round(temps.get("tj-thermal", max(temps.values(), default=0)), 1),
            "ram_used": round(100 * (1 - mem["MemAvailable"] / mem["MemTotal"]), 1),
            "ram_available": mem["MemAvailable"] // 1024,
            "gpu_load": gpu_avg,
            "cpu_load": cpu_pct,
            "llm_online": "off",
            "llm_model": "none",
            "faces_pending": 0,
        }
        try:
            with urllib.request.urlopen(f"{FRIGATE}/api/faces", timeout=5) as r:
                st["faces_pending"] = len(json.load(r).get("train", []))
        except Exception:
            pass
        try:
            with urllib.request.urlopen(f"{LLM}/api/ps", timeout=5) as r:
                models = json.load(r).get("models", [])
            st["llm_online"] = "on"
            st["llm_model"] = models[0]["name"] if models else "none"
        except Exception:
            pass
        return st


    last_discovery = 0
    cpu_prev = cpu_times()
    while True:
        # GPU load is an instant value (per mille) and Frigate/the LLM use the
        # GPU in short bursts, so average one sample per second over the 30 s.
        samples = []
        for _ in range(30):
            g = read("/sys/devices/platform/17000000.gpu/load")
            if g and g.isdigit():
                samples.append(int(g) / 10)
            time.sleep(1)
        gpu_avg = round(sum(samples) / len(samples), 1) if samples else 0
        idle, total = cpu_times()
        cpu_pct = round(100 * (1 - (idle - cpu_prev[0]) / max(total - cpu_prev[1], 1)), 1)
        cpu_prev = (idle, total)
        try:
            msgs = []
            if time.time() - last_discovery > 3600:
                msgs += discovery()
            msgs.append((STATE, json.dumps(state(gpu_avg, cpu_pct)), False))
            publish(msgs)
            if len(msgs) > 1:
                last_discovery = time.time()
        except Exception as e:
            print(f"monitor: {e}", flush=True)

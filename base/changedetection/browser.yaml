---
# Lightweight headless-Chrome (CDP) backend for changedetection.io's
# "WebDriver Chrome/Javascript" fetch method — used for JS-heavy / bot-protected
# sites (e.g. leroymerlin.pt, worten.pt) that 403 the plain HTTP client.
#
# sockpuppetbrowser is changedetection.io's own browser service (CDP/Playwright
# protocol). Much lighter than a full Selenium Grid + Chromium, which pins a
# whole CPU core on the Pi 4's software GL and never creates a session.
# When PLAYWRIGHT_DRIVER_URL is set, changedetection routes the WebDriver
# fetch method through this instead of Selenium.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: changedetection-browser
  labels:
    run: changedetection-browser
spec:
  replicas: 1
  selector:
    matchLabels:
      run: changedetection-browser
  template:
    metadata:
      labels:
        run: changedetection-browser
    spec:
      containers:
      - name: sockpuppet
        image: dgtlmoon/sockpuppetbrowser:latest
        ports:
        - containerPort: 3000
          name: cdp
        env:
        - name: SCREEN_WIDTH
          value: '1920'
        - name: SCREEN_HEIGHT
          value: '1024'
        - name: SCREEN_DEPTH
          value: '16'
        - name: MAX_CONCURRENT_CHROME_PROCESSES
          value: '2'
        securityContext:
          capabilities:
            add: [SYS_ADMIN]   # required for Chrome sandbox namespaces
        resources:
          requests:
            memory: 300Mi
          limits:
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: changedetection-browser
spec:
  ports:
  - port: 3000
    targetPort: 3000
    name: cdp
  selector:
    run: changedetection-browser

apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  failurePolicy: reinstall
  valuesContent: |-
    additionalArguments:
      - "--certificatesresolvers.letsencrypt.acme.email=antoniocanelas@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

    # acme.json must survive restarts: with the chart default (emptyDir) every
    # Traefik restart re-requests all certificates, and a restart during a
    # tplinkdns DNS hiccup leaves the external endpoints with no valid cert.
    persistence:
      enabled: true
      name: data
      accessMode: ReadWriteOnce
      size: 128Mi
      path: /data
      storageClass: "local-path"

    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
              - pi-master-00

    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
      websecure:
        tls:
          enabled: true
      homeassistantsecure:
        port: 8123
        exposedPort: 8123
        expose:
          default: true
        protocol: TCP
        tls:
          enabled: true
      plexsecure:
        port: 32443
        exposedPort: 32443
        expose:
          default: true
        protocol: TCP
        tls:
          enabled: true

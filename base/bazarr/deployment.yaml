apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: media
    run: bazarr
  name: bazarr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media
      run: bazarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: media
        run: bazarr
    spec:
      initContainers:
      - name: config
        image: busybox
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          set -e
          mkdir -p /config/bazarr/config /config/config
          RADARR_API_KEY=$(cat config/radarr/config.xml 2>/dev/null | sed -ne "/ApiKey/{s/.*<ApiKey>\(.*\)<\/ApiKey>.*/\1/p;q;}" || true)
          SONARR_API_KEY=$(cat config/sonarr/config.xml 2>/dev/null | sed -ne "/ApiKey/{s/.*<ApiKey>\(.*\)<\/ApiKey>.*/\1/p;q;}" || true)

          printf '%s\n' '---' 'general:' '  base_url: /bazarr' '  enabled_integrations:' '    - sonarr' '    - radarr' '  serie_default_enabled: true' '  movie_default_enabled: true' '  port: 6767' '  use_radarr: true' '  use_sonarr: true' '  use_embedded_subs: true' '  upgrade_subs: true' '  wanted_search_frequency: 6' > /config/bazarr/config/config.yaml
          cp /config/bazarr/config/config.yaml /config/config/config.yaml || true
          chown -R 1000:1000 /config/bazarr/config /config/config || true
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /movies
          name: media
          subPath: media/movies
        - mountPath: /tv
          name: media
          subPath: media/tv

      - name: wait-for-sonarr-and-radarr
        image: busybox
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          until nc -z sonarr 8989 >/dev/null 2>&1 && nc -z radarr 7878 >/dev/null 2>&1; do
            echo "waiting for sonarr and radarr (tcp)"
            sleep 2
          done

      containers:
      - name: bazarr
        image: linuxserver/bazarr:arm64v8-latest
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: Europe/Lisbon
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        ports:
        - containerPort: 6767
          name: webui
        livenessProbe:
          httpGet:
            path: /bazarr
            port: webui
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /bazarr
            port: webui
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 12
          successThreshold: 1
        startupProbe:
          httpGet:
            path: /bazarr
            port: webui
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - mountPath: /config
          name: config
          subPath: bazarr
        - mountPath: /movies
          name: media
          subPath: movies
        - mountPath: /tv
          name: media
          subPath: tv

      securityContext:
        fsGroup: 1000
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: ssd-config-pvc
      - name: downloads
        persistentVolumeClaim:
          claimName: ssd-downloads-pvc
      - name: media
        persistentVolumeClaim:
          claimName: nas-media-pvc
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: media
    run: bazarr
  name: bazarr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media
      run: bazarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: media
        run: bazarr
    spec:
      # nodeSelector intentionally omitted to allow scheduling on any healthy node
      initContainers:
      - name: config
        image: busybox
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          mkdir -p /config/bazarr/config
          export RADARR_API_KEY=$(cat config/radarr/config.xml | sed -ne "/ApiKey/{s/.*<ApiKey>\(.*\)<\/ApiKey>.*/\1/p;q;}" )
          export SONARR_API_KEY=$(cat config/sonarr/config.xml | sed -ne "/ApiKey/{s/.*<ApiKey>\(.*\)<\/ApiKey>.*/\1/p;q;}")

          echo "RADARR_API_KEY: $RADARR_API_KEY"
          echo "SONARR_API_KEY: $SONARR_API_KEY"

            cat << 'EOF' > /config/bazarr/config/config.yaml
            ---
            addic7ed:
              cookies: ''
              password: ''
              user_agent: ''
              username: ''
              vip: false
            analytics:
              enabled: true
            auth:
              apikey: ${BAZARR_API_KEY}
              password: ${BAZARR_AUTH_PASSWORD}
              type: form
              username: admin
            general:
              base_url: /bazarr
              enabled_integrations:
                - sonarr
                - radarr
              serie_default_enabled: true
              movie_default_enabled: true
              port: 6767
              use_radarr: true
              use_sonarr: true
              use_embedded_subs: true
              upgrade_subs: true
              wanted_search_frequency: 6
            EOF
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /movies
          name: media
          subPath: media/movies
        - mountPath: /tv
          name: media
          subPath: media/tv

      - name: wait-for-sonarr-and-radarr
        image: curlimages/curl:8.4.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          until (
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://sonarr:8989/sonarr)" = "200" ] || \
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://sonarr:8989/sonarr)" = "401" ]
          ) && (
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://radarr:7878/radarr)" = "200" ] || \
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://radarr:7878/radarr)" = "401" ]
          ); do
            echo waiting for sonarr and radarr
            sleep 2
          done

      containers:
      - name: bazarr
        image: linuxserver/bazarr:arm64v8-latest
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: Europe/Lisbon
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        ports:
        - containerPort: 6767
          name: webui
        livenessProbe:
          httpGet:
            path: /bazarr
            port: webui
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /bazarr
            port: webui
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 12
          successThreshold: 1
        startupProbe:
          httpGet:
            path: /bazarr
            port: webui
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - mountPath: /config
          name: config
          subPath: bazarr
        - mountPath: /movies
          name: media
          subPath: movies
        - mountPath: /tv
          name: media
          subPath: tv

      securityContext:
        fsGroup: 1000
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: ssd-config-pvc
      - name: downloads
        persistentVolumeClaim:
          claimName: ssd-downloads-pvc
      - name: media
        persistentVolumeClaim:
          claimName: nas-media-pvc

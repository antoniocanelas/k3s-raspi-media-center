apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  labels:
    app: media
  name: jellyfin-redirect
  namespace: media
spec:
  redirectRegex:
    permanent: false
    regex: ^https?://([^/]+)/jellyfin$
    replacement: https://$1/jellyfin/web/
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  labels:
    app: media
  name: plex-redirect
  namespace: media
spec:
  redirectRegex:
    permanent: false
    regex: ^https?://([^/]+)/plex$
    replacement: https://$1/plex/
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  labels:
    app: media
  name: redirect-bazarr-to-subdomain
  namespace: media
spec:
  redirectRegex:
    permanent: true
    regex: ^https?://qbittorrent\.telheira/bazarr/?(.*)$
    replacement: http://bazarr.telheira/$1

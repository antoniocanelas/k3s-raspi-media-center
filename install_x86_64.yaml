        volumeMounts:
        - mountPath: /config
          name: config
          subPath: sonarr
      securityContext:
        fsGroup: 1000
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: ssd-config-pvc
      - name: downloads
        persistentVolumeClaim:
          claimName: ssd-downloads-pvc
      - name: media
        persistentVolumeClaim:
          claimName: nas-media-pvc

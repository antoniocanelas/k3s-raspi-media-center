# Frigate NVR on jetson-orin-01: person detection for the 3 entrance cameras,
# replacing people-detector (kept at replicas: 0 for rollback).
# - Cameras are read from our go2rtc (one camera session each): substream camNN
#   for detection, main stream camNN_hd for event clips. RTSP login = camera
#   login, taken from Secret ai/camera-rtsp (CAM1_URL, already URL-encoded).
# - Motion detection runs on the CPU all the time; the TensorRT object detector
#   (YOLOv7-320, generated once into /config/model_cache) only runs where there
#   is motion, so the GPU stays mostly free for the LLM.
# - Recording: only alerts/detections (30 days); the Synology keeps the
#   continuous recordings.
# - Events, per-camera person counts and snapshots go to the Home Assistant
#   Mosquitto (Secret ai/mqtt) under frigate/.
# - UI: https://192.168.0.250:8971 (hostPort, Frigate login; the admin password
#   is printed in the pod log on first start).
# config.yml is copied from this ConfigMap on every start (GitOps): changes made
# in the Frigate UI are lost on restart; put them here instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate
  namespace: ai
data:
  config.yml: |
    mqtt:
      enabled: true
      host: 192.168.0.100
      port: 1883
      user: "{FRIGATE_MQTT_USER}"
      password: "{FRIGATE_MQTT_PASSWORD}"
      topic_prefix: frigate
      client_id: frigate-jetson

    # Live view in the Frigate UI: Frigate's own go2rtc restreams our go2rtc
    # (no new camera sessions). HD gets an AAC copy of the camera's PCMA audio
    # so browsers can play it.
    go2rtc:
      streams:
        cam60_hd:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@go2rtc.ai.svc.cluster.local:8554/cam60_hd
          - "ffmpeg:cam60_hd#audio=aac"
        cam60:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@go2rtc.ai.svc.cluster.local:8554/cam60
        cam62_hd:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@go2rtc.ai.svc.cluster.local:8554/cam62_hd
          - "ffmpeg:cam62_hd#audio=aac"
        cam62:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@go2rtc.ai.svc.cluster.local:8554/cam62
        cam63_hd:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@go2rtc.ai.svc.cluster.local:8554/cam63_hd
          - "ffmpeg:cam63_hd#audio=aac"
        cam63:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@go2rtc.ai.svc.cluster.local:8554/cam63

    # YOLOv7-320 TensorRT (FP16 engine). Tried on 2026-10-09 via the ONNX
    # detector (ONNX Runtime + CUDA): YOLOv9-s 38 ms / YOLOv9-t 28 ms, both with
    # ~+280 MB RAM in the detector process (runtime overhead), leaving ~500 MB
    # free on the Jetson with the LLM and face recognition (large). Back to
    # v7 (20 ms). The v9 ONNX files stay in /config/model_cache for retests:
    #   detectors: {onnx: {type: onnx}}
    #   model: {model_type: yolo-generic, path: /config/model_cache/yolov9-t-320.onnx,
    #           input_tensor: nchw, input_dtype: float, width: 320, height: 320}
    detectors:
      tensorrt:
        type: tensorrt
        device: 0

    model:
      path: /config/model_cache/tensorrt/yolov7-320.trt
      labelmap_path: /labelmap/coco-80.txt
      input_tensor: nchw
      input_pixel_format: rgb
      width: 320
      height: 320

    ffmpeg:
      hwaccel_args: preset-jetson-h264
      input_args: preset-rtsp-restream

    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5

    # One YOLOv7 pass detects all COCO classes, so tracking more labels does
    # not cost GPU; it only adds events. Only people raise alerts (review).
    objects:
      track:
        - person
        - car
        - cat
        - dog
      filters:
        person:
          min_score: 0.5
          threshold: 0.7
        car:
          min_score: 0.5
          threshold: 0.7
        cat:
          min_score: 0.5
          threshold: 0.7
        dog:
          min_score: 0.5
          threshold: 0.7

    # Combined all-cameras view: unused, costs an encoder/output process.
    birdseye:
      enabled: false

    # Kept 30 days so the HA "Deteções" gallery covers the last month
    # (alert clips are short; the NVMe has >100 GB free).
    # Date/time drawn on snapshots only (cheap, once per snapshot). Clips are
    # stream copies; burning a timestamp in would need CPU re-encoding (no
    # NVENC on the Orin Nano), and players show the time anyway.
    snapshots:
      enabled: true
      bounding_box: true
      timestamp: true
      retain:
        default: 30

    record:
      enabled: true
      continuous:
        days: 0
      motion:
        days: 0
      alerts:
        retain:
          days: 30
      detections:
        retain:
          days: 30

    review:
      alerts:
        labels:
          - person

    # Face recognition (trial since 2026-10-09): large model (ArcFace, GPU).
    # The model stays loaded in the embeddings process; it only runs on
    # tracked persons. Enabled on Porta and Portao only (cam60 overrides).
    # Faces are trained in the Frigate UI (Face Library). Measure Jetson RAM
    # (was ~960 MB available before) and switch to model_size: small or
    # disable if memory gets tight.
    face_recognition:
      enabled: true
      model_size: large

    cameras:
      cam60:
        friendly_name: Geral
        face_recognition:
          enabled: false
        live:
          streams:
            Alta qualidade: cam60_hd
            Baixa qualidade: cam60
        ffmpeg:
          inputs:
            - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@go2rtc.ai.svc.cluster.local:8554/cam60
              roles: [detect]
            - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@go2rtc.ai.svc.cluster.local:8554/cam60_hd
              roles: [record]
      cam62:
        friendly_name: Porta
        live:
          streams:
            Alta qualidade: cam62_hd
            Baixa qualidade: cam62
        # Plants along the passage kept triggering motion; the path itself
        # stays unmasked (people walk there). Pixels of the 1280x720 detect frame.
        motion:
          mask:
            jardim_fundo:
              friendly_name: Palmeira e jardim ao fundo
              enabled: true
              coordinates: "400,0,880,0,880,75,400,75"
            canteiro:
              friendly_name: Canteiro a esquerda
              enabled: true
              coordinates: "410,225,540,225,670,720,430,720"
            vasos:
              friendly_name: Vasos a direita
              enabled: true
              coordinates: "824,338,1010,338,1010,638,824,638"
            plantas_baixo:
              friendly_name: Plantas em baixo a direita
              enabled: true
              coordinates: "960,555,1280,555,1280,720,960,720"
        ffmpeg:
          inputs:
            - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@go2rtc.ai.svc.cluster.local:8554/cam62_hd
              roles: [detect, record]
        # Detect on the main stream at 1280x720 (since 2026-10-09) so faces have
        # enough pixels for face recognition; the main stream is 720p today.
        # Masks are pixels of this 1280x720 frame (converted from the old
        # 640x480 sub stream: x*2, y*1.5, same field of view).
        detect:
          width: 1280
          height: 720
      cam63:
        friendly_name: Portão
        live:
          streams:
            Alta qualidade: cam63_hd
            Baixa qualidade: cam63
        # The hedge/plants along the back wall and the sunlit wooden fence on
        # the right kept the detector busy (~5 detections/s with nobody there).
        # Pixels of the 1280x720 detect frame: 0.18 rejects relative
        # coordinates in camera-level masks ("invalid literal for int()").
        motion:
          mask:
            sebe:
              friendly_name: Sebe, plantas e vedacao
              enabled: true
              coordinates: "204,0,1280,0,1280,237,1100,237,934,159,794,129,666,87,204,54"
        ffmpeg:
          inputs:
            - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@go2rtc.ai.svc.cluster.local:8554/cam63_hd
              roles: [detect, record]
        # Detect on the main stream at 1280x720 (since 2026-10-09) so faces have
        # enough pixels for face recognition; the main stream is 720p today.
        # Masks are pixels of this 1280x720 frame (converted from the old
        # 640x480 sub stream: x*2, y*1.5, same field of view).
        detect:
          width: 1280
          height: 720
        objects:
          filters:
            person:
              mask:
                caminho:
                  friendly_name: Caminho fora da propriedade
                  enabled: true
                  # Pixels of the 1280x720 detect frame (0.18 rejected relative
                  # coordinates here: "invalid literal for int()").
                  coordinates: "940,0,1280,0,1280,105,940,105"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: ai
  labels:
    app: frigate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frigate
  template:
    metadata:
      labels:
        app: frigate
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: jetson-orin-01
      tolerations:
      - key: workload
        operator: Equal
        value: jetson
        effect: NoSchedule
      terminationGracePeriodSeconds: 30
      containers:
      - name: frigate
        image: ghcr.io/blakeblackshear/frigate:0.18.0-tensorrt-jp6
        command:
        - bash
        - -c
        - |
          set -e
          # RTSP login for go2rtc = camera login, kept URL-encoded (it goes into URLs).
          cred="${CAM1_URL#*://}"; cred="${cred%%@*}"
          export FRIGATE_RTSP_USER="${cred%%:*}" FRIGATE_RTSP_PASSWORD="${cred#*:}"
          unset CAM1_URL
          cp /frigate-config/config.yml /config/config.yml
          exec /init
        env:
        - name: CAM1_URL
          valueFrom:
            secretKeyRef:
              name: camera-rtsp
              key: CAM1_URL
        - name: FRIGATE_MQTT_USER
          valueFrom:
            secretKeyRef:
              name: mqtt
              key: MQTT_USER
        - name: FRIGATE_MQTT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mqtt
              key: MQTT_PASS
        # TensorRT engine generated on first start into /config/model_cache.
        - name: YOLO_MODELS
          value: yolov7-320
        - name: TZ
          value: Europe/Lisbon
        ports:
        - name: ui
          containerPort: 8971
          hostPort: 8971
        - name: api
          containerPort: 5000
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            memory: 3Gi
        volumeMounts:
        - name: config-src
          mountPath: /frigate-config
        - name: data
          mountPath: /config
          subPath: frigate/config
        - name: data
          mountPath: /media/frigate
          subPath: frigate/media
        - name: cache
          mountPath: /tmp/cache
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: config-src
        configMap:
          name: frigate
      - name: data
        persistentVolumeClaim:
          claimName: jetson-ai-pvc
      - name: cache
        emptyDir:
          sizeLimit: 2Gi
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
---
# In-cluster API (port 5000, no auth) for other pods, e.g. jetson-monitor.
apiVersion: v1
kind: Service
metadata:
  name: frigate
  namespace: ai
  labels:
    app: frigate
spec:
  selector:
    app: frigate
  ports:
  - name: api
    port: 5000
    targetPort: api
  - name: ui
    port: 8971
    targetPort: ui

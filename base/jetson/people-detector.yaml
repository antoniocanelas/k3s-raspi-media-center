# Person detection on jetson-orin-01 (DeepStream 7.1, NVIDIA PeopleNet
# ResNet34 INT8: person + face, IOU tracker). Reads the cameras' RTSP *substreams* directly
# (rtsp://USER:PASS@192.168.0.6x:554/stream2) from Secret ai/camera-rtsp,
# keys CAM1_URL..CAM3_URL. The Secret is created by hand (never in git); while
# it is missing the pod idles without touching the GPU. After creating or
# changing it: kubectl -n ai delete pod -l app=people-detector
# (not "rollout restart": Flux reverts the restartedAt annotation and rolls
# the pod a second time).
#
# Output: per-stream FPS in the pod logs (**PERF lines) and, when Secret ai/mqtt
# exists (MQTT_USER, MQTT_PASS), person detections published to the Home
# Assistant Mosquitto broker on topic jetson/people (see sink-mqtt.txt).
apiVersion: v1
kind: ConfigMap
metadata:
  name: people-detector
  namespace: ai
data:
  run.sh: |
    #!/bin/bash
    set -e
    if [ -z "${CAM1_URL}${CAM2_URL}${CAM3_URL}" ]; then
      echo "Secret ai/camera-rtsp missing or empty; idling."
      exec sleep infinity
    fi
    # PeopleNet (NGC, public) lives on the PVC so the TensorRT engine nvinfer
    # builds next to the ONNX (10+ minutes on first run) survives restarts.
    # TrafficCamNet (the DeepStream sample) missed people seen from above.
    M=/models/deepstream/peoplenet
    NGC=https://api.ngc.nvidia.com/v2/models/nvidia/tao/peoplenet/versions/deployable_quantized_onnx_v2.6.3/files
    mkdir -p "$M"
    for f in resnet34_peoplenet.onnx resnet34_peoplenet_int8.txt labels.txt; do
      if [ ! -s "$M/$f" ]; then
        curl -fsSL --retry 5 -o "$M/$f.part" "$NGC/$f"
        mv "$M/$f.part" "$M/$f"
      fi
    done
    # type=3 (uridecodebin), not type=4 (rtspsrc): camera .63 also sends a
    # PCMA audio track, and with type=4 the unlinked audio pad stalls that
    # source at 0 fps. uridecodebin ignores the audio. Without type=4 there is
    # no built-in RTSP reconnect: supervisor.py restarts the container when a
    # camera stays at 0 fps.
    # rtspt:// forces RTP over TCP: UDP RTP from the cameras never reaches the
    # pod (pod network NAT), and the UDP->TCP fallback is unreliable.
    n=0
    : > /tmp/sources.txt
    : > /tmp/msgconv.txt
    for u in "$CAM1_URL" "$CAM2_URL" "$CAM3_URL"; do
      [ -n "$u" ] || continue
      u="rtspt:${u#rtsp:}"
      # Sensor id from the camera IP's last octet (rtsp://u:p@192.168.0.60:...
      # -> cam60); it is the sensorId in the MQTT payload.
      h="${u##*@}"; h="${h%%[:/]*}"
      cat >> /tmp/sources.txt <<EOF
    [source$n]
    enable=1
    type=3
    uri=$u
    num-sources=1
    gpu-id=0

    EOF
      cat >> /tmp/msgconv.txt <<EOF
    [sensor$n]
    enable=1
    type=Camera
    id=cam${h##*.}
    location=0;0;0
    description=$h
    coordinate=0;0;0

    EOF
      n=$((n+1))
    done
    sed "s/@BATCH@/$n/" /config/pgie.txt > /tmp/pgie.txt
    sed "s/@BATCH@/$n/" /config/app.txt > /tmp/app.txt
    cat /tmp/sources.txt >> /tmp/app.txt
    # Person events to MQTT (Home Assistant Mosquitto) when Secret ai/mqtt
    # exists. Minimal payload, at most one message per camera per second.
    # deepstream-app exits if the broker refuses the connection, so check the
    # login first and run without the MQTT sink (detection only) if it fails;
    # supervisor.py then restarts later to retry.
    export MQTT_HOST="${MQTT_HOST:-192.168.0.100}" MQTT_PORT="${MQTT_PORT:-1883}"
    export MQTT_STATE=off
    if [ -n "$MQTT_USER" ]; then
      if python3 /config/supervisor.py --check-mqtt; then
        printf '[message-broker]\nusername = %s\npassword = %s\nclient-id = jetson-people-detector\n' \
          "$MQTT_USER" "$MQTT_PASS" > /tmp/mqtt.txt
        cat /config/sink-mqtt.txt >> /tmp/app.txt
        sed -i "s/@MQTT@/$MQTT_HOST;$MQTT_PORT/" /tmp/app.txt
        echo "MQTT events enabled: $MQTT_HOST:$MQTT_PORT topic jetson/people"
        MQTT_STATE=on
      else
        echo "MQTT broker unavailable or login refused; detection only, will retry"
        MQTT_STATE=retry
      fi
    fi
    echo "Starting deepstream-app with $n camera(s)"
    exec python3 /config/supervisor.py /tmp/app.txt
  supervisor.py: |
    """Run deepstream-app and keep it healthy.

    - Restarts (exit 1) when any camera reports 0 fps for STALL_SEC: with
      uridecodebin a source whose RTSP session stalls never recovers by itself.
    - Stops deepstream-app with SIGINT (on SIGTERM or before a restart) so the
      pipeline goes to NULL and sends RTSP TEARDOWN; killed sessions linger on
      the TP-Link cameras and use up their small concurrent-stream limit.
    - With MQTT_STATE=retry (broker check failed at start), exits after
      MQTT_RETRY_SEC so the next start retries the broker.
    - --check-mqtt: MQTT 3.1.1 CONNECT with MQTT_USER/MQTT_PASS, exit 0 if
      the broker accepts the login.
    """
    import os
    import re
    import signal
    import socket
    import struct
    import subprocess
    import sys
    import threading
    import time

    STALL_SEC = int(os.environ.get("STALL_SEC", "180"))
    MQTT_RETRY_SEC = int(os.environ.get("MQTT_RETRY_SEC", "900"))
    PERF = re.compile(r"([0-9.]+) \(([0-9.]+)\)")


    def check_mqtt():
        def s(v):
            b = v.encode()
            return struct.pack("!H", len(b)) + b
        user, pw = os.environ["MQTT_USER"], os.environ.get("MQTT_PASS", "")
        var = s("MQTT") + bytes([4, 0xC2]) + struct.pack("!H", 30)
        payload = s("jetson-people-detector-check") + s(user) + s(pw)
        body = var + payload
        try:
            with socket.create_connection(
                    (os.environ["MQTT_HOST"], int(os.environ["MQTT_PORT"])), timeout=5) as c:
                c.sendall(bytes([0x10, len(body)]) + body)
                ack = c.recv(4)
                c.sendall(bytes([0xE0, 0]))
        except OSError as e:
            print(f"mqtt check: {e}", flush=True)
            return 1
        rc = ack[3] if len(ack) == 4 and ack[0] == 0x20 else -1
        print(f"mqtt check: CONNACK {rc}", flush=True)
        return 0 if rc == 0 else 1


    def main(cfg):
        proc = subprocess.Popen(["deepstream-app", "-c", cfg], stdout=subprocess.PIPE,
                                stderr=subprocess.STDOUT, text=True, bufsize=1)
        zero_since = {}

        def reader():
            for line in proc.stdout:
                sys.stdout.write(line)
                sys.stdout.flush()
                if not line.startswith("**PERF:") or "FPS" in line:
                    continue
                now = time.monotonic()
                for i, (cur, _avg) in enumerate(PERF.findall(line)):
                    if float(cur) > 0:
                        zero_since.pop(i, None)
                    else:
                        zero_since.setdefault(i, now)

        def stop(reason, code):
            print(f"supervisor: {reason}; stopping deepstream-app", flush=True)
            if proc.poll() is None:
                proc.send_signal(signal.SIGINT)
                try:
                    proc.wait(timeout=20)
                except subprocess.TimeoutExpired:
                    proc.kill()
            sys.exit(code)

        signal.signal(signal.SIGTERM, lambda *_: stop("SIGTERM", 0))
        threading.Thread(target=reader, daemon=True).start()
        started = time.monotonic()
        while proc.poll() is None:
            time.sleep(5)
            now = time.monotonic()
            # Before any camera produced frames, allow STALL_SEC from start.
            for i, t0 in list(zero_since.items()):
                if now - max(t0, started) > STALL_SEC:
                    stop(f"camera {i} at 0 fps for {STALL_SEC}s", 1)
            if os.environ.get("MQTT_STATE") == "retry" and now - started > MQTT_RETRY_SEC:
                stop("retrying MQTT broker", 0)
        sys.exit(proc.returncode or 1)


    if __name__ == "__main__":
        if sys.argv[1] == "--check-mqtt":
            sys.exit(check_mqtt())
        main(sys.argv[1])
  app.txt: |
    [application]
    enable-perf-measurement=1
    perf-measurement-interval-sec=30

    [streammux]
    gpu-id=0
    live-source=1
    batch-size=@BATCH@
    batched-push-timeout=40000
    # Camera substreams are 640x480; keep them at native size (no stretching).
    width=640
    height=480
    enable-padding=0

    [primary-gie]
    enable=1
    gpu-id=0
    gie-unique-id=1
    batch-size=@BATCH@
    # Infer every 3rd frame; the tracker fills the gaps.
    interval=2
    config-file=/tmp/pgie.txt

    [tracker]
    enable=1
    tracker-width=640
    tracker-height=384
    ll-lib-file=/opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
    ll-config-file=/opt/nvidia/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_IOU.yml

    [osd]
    enable=0

    [tiled-display]
    enable=0

    [sink0]
    enable=1
    type=1
    sync=0

  sink-mqtt.txt: |
    [sink1]
    enable=1
    # MsgConvBroker: nvmsgconv builds the payload straight from frame/object
    # metadata (msg2p new API), nvmsgbroker publishes it over MQTT.
    type=6
    sync=0
    msg-conv-config=/tmp/msgconv.txt
    # 1 = minimal schema: sensorId + "trackingId|left|top|right|bottom|person"
    msg-conv-payload-type=1
    msg-conv-msg2p-new-api=1
    # Streams run at ~25 fps: one message per camera per second at most.
    msg-conv-frame-interval=25
    msg-broker-proto-lib=/opt/nvidia/deepstream/deepstream/lib/libnvds_mqtt_proto.so
    msg-broker-conn-str=@MQTT@
    msg-broker-config=/tmp/mqtt.txt
    topic=jetson/people

  pgie.txt: |
    [property]
    gpu-id=0
    net-scale-factor=0.00392156862745098
    onnx-file=/models/deepstream/peoplenet/resnet34_peoplenet.onnx
    model-engine-file=/models/deepstream/peoplenet/resnet34_peoplenet.onnx_b@BATCH@_gpu0_int8.engine
    labelfile-path=/models/deepstream/peoplenet/labels.txt
    int8-calib-file=/models/deepstream/peoplenet/resnet34_peoplenet_int8.txt
    infer-dims=3;544;960
    batch-size=@BATCH@
    process-mode=1
    model-color-format=0
    network-mode=1
    num-detected-classes=3
    gie-unique-id=1
    cluster-mode=2

    # labels: person;bag;face - keep person (0) and face (2, for later face
    # recognition); consumers must filter on the label.
    [class-attrs-all]
    topk=20
    nms-iou-threshold=0.5
    pre-cluster-threshold=1.1

    [class-attrs-0]
    topk=20
    nms-iou-threshold=0.5
    pre-cluster-threshold=0.4

    [class-attrs-2]
    topk=20
    nms-iou-threshold=0.5
    pre-cluster-threshold=0.5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: people-detector
  namespace: ai
  labels:
    app: people-detector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: people-detector
  template:
    metadata:
      labels:
        app: people-detector
    spec:
      runtimeClassName: nvidia
      # supervisor.py needs time to stop deepstream-app cleanly (RTSP TEARDOWN).
      terminationGracePeriodSeconds: 40
      nodeSelector:
        kubernetes.io/hostname: jetson-orin-01
      tolerations:
      - key: workload
        operator: Equal
        value: jetson
        effect: NoSchedule
      initContainers:
      # On Jetson, CUDA reports page cache as used memory; a TensorRT engine
      # build can fail with "insufficient memory" unless the cache is dropped
      # first. Only needed while no engine has been built yet.
      - name: drop-caches
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          if ls /models/deepstream/peoplenet/*.engine >/dev/null 2>&1; then exit 0; fi
          sync && echo 3 > /proc/sys/vm/drop_caches
        securityContext:
          privileged: true
        volumeMounts:
        - name: models
          mountPath: /models
          subPath: models
      containers:
      - name: deepstream
        image: nvcr.io/nvidia/deepstream:7.1-samples-multiarch
        command: ["bash", "/config/run.sh"]
        envFrom:
        - secretRef:
            name: camera-rtsp
            optional: true
        # MQTT_USER / MQTT_PASS (optional MQTT_HOST / MQTT_PORT) for events.
        - secretRef:
            name: mqtt
            optional: true
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            memory: 3Gi
        volumeMounts:
        - name: config
          mountPath: /config
        - name: models
          mountPath: /models
          subPath: models
      volumes:
      - name: config
        configMap:
          name: people-detector
      - name: models
        persistentVolumeClaim:
          claimName: jetson-ai-pvc

# Zero endpoints live: selector matches no pod and there is no manually
# created Endpoints/EndpointSlice either. Home Assistant does not appear to
# run inside this cluster at all - tracked as-is for accuracy.
apiVersion: v1
kind: Service
metadata:
  name: homeassistant-external
  labels:
    app: media
spec:
  ports:
  - port: 8123
    targetPort: 8123
    name: http
  selector:
    app: media
    external-backend: "true"

apiVersion: v1
data:
  run.sh: |
    #!/bin/sh
    set -e
    # RTSP login = camera login (URL-decoded user:pass of CAM1_URL), written
    # as YAML single-quoted strings ('' escapes a quote).
    yq() { awk -v s="$1" 'BEGIN {
      h = "0123456789abcdef"; o = ""
      for (i = 1; i <= length(s); i++) {
        c = substr(s, i, 1)
        if (c == "%" && i + 2 <= length(s)) {
          c = sprintf("%c", (index(h, tolower(substr(s, i+1, 1))) - 1) * 16 + index(h, tolower(substr(s, i+2, 1))) - 1)
          i += 2
        }
        if (c == "\047") c = "\047\047"
        o = o c
      }
      printf "\047%s\047", o }'; }
    cred="${CAM1_URL#*://}"; cred="${cred%%@*}"
    {
      echo 'rtsp:'
      echo '  listen: ":8554"'
      echo "  username: $(yq "${cred%%:*}")"
      echo "  password: $(yq "${cred#*:}")"
      echo 'api:'
      echo '  listen: ":1984"'
      echo 'webrtc:'
      echo '  listen: ""'
      echo 'streams:'
      for u in "$CAM1_URL" "$CAM2_URL" "$CAM3_URL"; do
        [ -n "$u" ] || continue
        h="${u##*@}"; h="${h%%[:/]*}"
        printf '  cam%s: "%s#media=video"\n' "${h##*.}" "$u"
        printf '  cam%s_hd: "%s"\n' "${h##*.}" "${u%/stream2}/stream1"
      done
    } > /tmp/go2rtc.yaml
    exec go2rtc -config /tmp/go2rtc.yaml
kind: ConfigMap
metadata:
  name: go2rtc
  namespace: ai
---
apiVersion: v1
data:
  monitor.py: |
    import glob
    import json
    import os
    import socket
    import struct
    import time
    import urllib.request

    HOST = os.environ.get("MQTT_HOST", "192.168.0.100")
    PORT = int(os.environ.get("MQTT_PORT", "1883"))
    USER, PASS = os.environ.get("MQTT_USER", ""), os.environ.get("MQTT_PASS", "")
    LLM = os.environ.get("LLM_URL", "http://llm.ai.svc.cluster.local:8080")
    STATE = "jetson/monitor/state"
    DEVICE = {"identifiers": ["jetson-orin-01"], "name": "Jetson Orin Nano",
              "manufacturer": "NVIDIA / Waveshare", "model": "Orin Nano 8GB (JetPack 6.2)"}


    def _s(v):
        b = v.encode()
        return struct.pack("!H", len(b)) + b


    def _len(n):
        out = b""
        while True:
            d, n = n % 128, n // 128
            out += bytes([d | (0x80 if n else 0)])
            if not n:
                return out


    def publish(msgs):
        """Publish [(topic, payload, retain)] over one MQTT 3.1.1 connection."""
        flags = 0x02 | (0x80 if USER else 0) | (0x40 if PASS else 0)
        conn = _s("MQTT") + bytes([4, flags]) + struct.pack("!H", 60) + _s("jetson-monitor")
        if USER:
            conn += _s(USER)
        if PASS:
            conn += _s(PASS)
        with socket.create_connection((HOST, PORT), timeout=10) as c:
            c.sendall(bytes([0x10]) + _len(len(conn)) + conn)
            ack = c.recv(4)
            if len(ack) < 4 or ack[3] != 0:
                raise OSError(f"CONNACK {list(ack)}")
            for topic, payload, retain in msgs:
                body = _s(topic) + payload.encode()
                c.sendall(bytes([0x31 if retain else 0x30]) + _len(len(body)) + body)
            c.sendall(bytes([0xE0, 0]))


    def discovery():
        def sensor(key, name, comp="sensor", **extra):
            cfg = {"name": name, "unique_id": f"jetson_orin_{key}",
                   "default_entity_id": f"{comp}.jetson_{key}", "state_topic": STATE,
                   "value_template": "{{ value_json.%s }}" % key, "expire_after": 120,
                   "device": DEVICE, **extra}
            return (f"homeassistant/{comp}/jetson_orin/{key}/config", json.dumps(cfg), True)
        msgs = [
            sensor("temperature", "Temperatura", unit_of_measurement="°C",
                   device_class="temperature", state_class="measurement"),
            sensor("ram_used", "RAM usada", unit_of_measurement="%", state_class="measurement",
                   icon="mdi:memory"),
            sensor("ram_available", "RAM disponível", unit_of_measurement="MB",
                   state_class="measurement", icon="mdi:memory"),
            sensor("gpu_load", "Carga GPU", unit_of_measurement="%", state_class="measurement",
                   icon="mdi:expansion-card"),
            sensor("llm_model", "Modelo LLM carregado", icon="mdi:brain"),
            sensor("llm_online", "LLM", comp="binary_sensor", device_class="connectivity",
                   payload_on="on", payload_off="off"),
        ]
        # Per-camera fps from Frigate's stats (published every 60 s).
        for cam in ("cam60", "cam62", "cam63"):
            cfg = {"name": f"FPS {cam}", "unique_id": f"jetson_orin_fps_{cam}",
                   "default_entity_id": f"sensor.jetson_fps_{cam}",
                   "state_topic": "frigate/stats",
                   "value_template": "{{ value_json.cameras.%s.camera_fps | default(0) }}" % cam,
                   "unit_of_measurement": "fps", "state_class": "measurement",
                   "icon": "mdi:cctv", "expire_after": 180, "device": DEVICE}
            msgs.append((f"homeassistant/sensor/jetson_orin/fps_{cam}/config", json.dumps(cfg), True))
        cfg = {"name": "Inferência Frigate", "unique_id": "jetson_orin_frigate_inference",
               "default_entity_id": "sensor.jetson_frigate_inference",
               "state_topic": "frigate/stats",
               "value_template": "{{ value_json.detectors.tensorrt.inference_speed | default(0) }}",
               "unit_of_measurement": "ms", "state_class": "measurement",
               "icon": "mdi:timer-outline", "expire_after": 180, "device": DEVICE}
        msgs.append(("homeassistant/sensor/jetson_orin/frigate_inference/config", json.dumps(cfg), True))
        return msgs


    def read(path, default=None):
        # Some Orin thermal zones (cv0-2) fail on read (EAGAIN surfaces as a
        # TypeError from the decoder), so treat any error as "no value".
        try:
            with open(path) as f:
                return f.read().strip()
        except Exception:
            return default


    def state():
        temps = {}
        for z in glob.glob("/sys/devices/virtual/thermal/thermal_zone*"):
            t = read(f"{z}/temp")
            if t and t.lstrip("-").isdigit():
                temps[read(f"{z}/type", z)] = int(t) / 1000
        mem = {}
        for line in open("/proc/meminfo"):
            k, v = line.split(":")
            mem[k] = int(v.split()[0])
        gpu = read("/sys/devices/platform/17000000.gpu/load", "0")
        st = {
            "temperature": round(temps.get("tj-thermal", max(temps.values(), default=0)), 1),
            "ram_used": round(100 * (1 - mem["MemAvailable"] / mem["MemTotal"]), 1),
            "ram_available": mem["MemAvailable"] // 1024,
            "gpu_load": round(int(gpu) / 10, 1),
            "llm_online": "off",
            "llm_model": "none",
        }
        try:
            with urllib.request.urlopen(f"{LLM}/api/ps", timeout=5) as r:
                models = json.load(r).get("models", [])
            st["llm_online"] = "on"
            st["llm_model"] = models[0]["name"] if models else "none"
        except Exception:
            pass
        return st


    last_discovery = 0
    while True:
        try:
            msgs = []
            if time.time() - last_discovery > 3600:
                msgs += discovery()
            msgs.append((STATE, json.dumps(state()), False))
            publish(msgs)
            if len(msgs) > 1:
                last_discovery = time.time()
        except Exception as e:
            print(f"monitor: {e}", flush=True)
        time.sleep(30)
kind: ConfigMap
metadata:
  name: jetson-monitor
  namespace: ai
---
apiVersion: v1
data:
  app.txt: |
    [application]
    enable-perf-measurement=1
    perf-measurement-interval-sec=30

    [streammux]
    gpu-id=0
    live-source=1
    batch-size=@BATCH@
    batched-push-timeout=40000
    # Camera substreams are 640x480; keep them at native size (no stretching).
    width=640
    height=480
    enable-padding=0

    [primary-gie]
    enable=1
    gpu-id=0
    gie-unique-id=1
    batch-size=@BATCH@
    # Infer every 6th frame (~4 detections/s per camera); the tracker fills
    # the gaps. With interval=2 PeopleNet kept the GPU at 99% and the LLM
    # (priority workload) dropped to ~7 tokens/s.
    interval=5
    config-file=/tmp/pgie.txt

    [tracker]
    enable=1
    tracker-width=640
    tracker-height=384
    ll-lib-file=/opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
    ll-config-file=/opt/nvidia/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_IOU.yml

    [osd]
    enable=0

    [tiled-display]
    enable=0

    [sink0]
    enable=1
    type=1
    sync=0
  pgie.txt: |
    [property]
    gpu-id=0
    net-scale-factor=0.00392156862745098
    onnx-file=/models/deepstream/peoplenet/resnet34_peoplenet.onnx
    model-engine-file=/models/deepstream/peoplenet/resnet34_peoplenet.onnx_b@BATCH@_gpu0_int8.engine
    labelfile-path=/models/deepstream/peoplenet/labels.txt
    int8-calib-file=/models/deepstream/peoplenet/resnet34_peoplenet_int8.txt
    infer-dims=3;544;960
    batch-size=@BATCH@
    process-mode=1
    model-color-format=0
    network-mode=1
    num-detected-classes=3
    gie-unique-id=1
    cluster-mode=2

    # labels: person;bag;face - keep person (0) and face (2, for later face
    # recognition); consumers must filter on the label.
    [class-attrs-all]
    topk=20
    nms-iou-threshold=0.5
    pre-cluster-threshold=1.1

    [class-attrs-0]
    topk=20
    nms-iou-threshold=0.5
    pre-cluster-threshold=0.4

    [class-attrs-2]
    topk=20
    nms-iou-threshold=0.5
    pre-cluster-threshold=0.5
  run.sh: |
    #!/bin/bash
    set -e
    if [ -z "${CAM1_URL}${CAM2_URL}${CAM3_URL}" ]; then
      echo "Secret ai/camera-rtsp missing or empty; idling."
      exec sleep infinity
    fi
    # PeopleNet (NGC, public) lives on the PVC so the TensorRT engine nvinfer
    # builds next to the ONNX (10+ minutes on first run) survives restarts.
    # TrafficCamNet (the DeepStream sample) missed people seen from above.
    M=/models/deepstream/peoplenet
    NGC=https://api.ngc.nvidia.com/v2/models/nvidia/tao/peoplenet/versions/deployable_quantized_onnx_v2.6.3/files
    mkdir -p "$M"
    for f in resnet34_peoplenet.onnx resnet34_peoplenet_int8.txt labels.txt; do
      if [ ! -s "$M/$f" ]; then
        curl -fsSL --retry 5 -o "$M/$f.part" "$NGC/$f"
        mv "$M/$f.part" "$M/$f"
      fi
    done
    # type=3 (uridecodebin), not type=4 (rtspsrc): camera .63 also sends a
    # PCMA audio track, and with type=4 the unlinked audio pad stalls that
    # source at 0 fps. uridecodebin ignores the audio. Without type=4 there is
    # no built-in RTSP reconnect: supervisor.py restarts the container when a
    # camera stays at 0 fps.
    # Streams come from go2rtc (base/jetson/go2rtc.yaml), which holds a single
    # session per camera, so detector restarts no longer open camera sessions.
    # rtspt:// forces RTP over TCP (UDP RTP does not cross the pod network NAT).
    # go2rtc requires the cameras' login, reused from the camera URL.
    G="${GO2RTC_HOST:-go2rtc.ai.svc.cluster.local:8554}"
    n=0
    : > /tmp/sources.txt
    : > /tmp/msgconv.txt
    : > /tmp/cams.txt
    for u in "$CAM1_URL" "$CAM2_URL" "$CAM3_URL"; do
      [ -n "$u" ] || continue
      # Sensor id / go2rtc stream name from the camera IP's last octet
      # (rtsp://u:p@192.168.0.60:... -> cam60); it is the MQTT sensorId.
      h="${u##*@}"; h="${h%%[:/]*}"
      c="${u#*://}"; c="${c%%@*}"
      u="rtspt://$c@$G/cam${h##*.}"
      cat >> /tmp/sources.txt <<EOF
    [source$n]
    enable=1
    type=3
    uri=$u
    num-sources=1
    gpu-id=0

    EOF
      cat >> /tmp/msgconv.txt <<EOF
    [sensor$n]
    enable=1
    type=Camera
    id=cam${h##*.}
    location=0;0;0
    description=$h
    coordinate=0;0;0

    EOF
      echo "cam${h##*.}" >> /tmp/cams.txt
      n=$((n+1))
    done
    sed "s/@BATCH@/$n/" /config/pgie.txt > /tmp/pgie.txt
    sed "s/@BATCH@/$n/" /config/app.txt > /tmp/app.txt
    cat /tmp/sources.txt >> /tmp/app.txt
    # Person events go to the local Mosquitto sidecar (127.0.0.1:1883), which
    # bridges jetson/# to the Home Assistant broker and reconnects on its own.
    # Talking to the HA broker directly, every broker hiccup ended
    # deepstream-app ("client is not currently connected" -> App run failed).
    export MQTT_HOST=127.0.0.1 MQTT_PORT=1883
    python3 /config/supervisor.py --wait-mqtt
    printf '[message-broker]\nusername = local\npassword = local\nclient-id = jetson-people-detector\n' > /tmp/mqtt.txt
    cat /config/sink-mqtt.txt >> /tmp/app.txt
    sed -i "s/@MQTT@/$MQTT_HOST;$MQTT_PORT/" /tmp/app.txt
    echo "MQTT events via local bridge, topic jetson/people"
    echo "Starting deepstream-app with $n camera(s)"
    exec python3 /config/supervisor.py /tmp/app.txt
  sink-mqtt.txt: |
    [sink1]
    enable=1
    # MsgConvBroker: nvmsgconv builds the payload straight from frame/object
    # metadata (msg2p new API), nvmsgbroker publishes it over MQTT.
    type=6
    sync=0
    msg-conv-config=/tmp/msgconv.txt
    # 1 = minimal schema: sensorId + "trackingId|left|top|right|bottom|person"
    msg-conv-payload-type=1
    msg-conv-msg2p-new-api=1
    # Streams run at ~25 fps: one message per camera per second at most.
    msg-conv-frame-interval=25
    msg-broker-proto-lib=/opt/nvidia/deepstream/deepstream/lib/libnvds_mqtt_proto.so
    msg-broker-conn-str=@MQTT@
    msg-broker-config=/tmp/mqtt.txt
    topic=jetson/people
  supervisor.py: |
    """Run deepstream-app and keep it healthy.

    - Restarts (exit 1) when any camera reports 0 fps for STALL_SEC: with
      uridecodebin a source whose RTSP session stalls never recovers by itself.
      The TP-Link cameras only serve a few concurrent streams and keep dead
      sessions until they time out, so restarts are rare (10 min) and wait
      RESTART_DELAY after stopping, letting the cameras free the sessions
      before the next start reconnects.
    - Stops deepstream-app with SIGINT (on SIGTERM or before a restart) so the
      pipeline goes to NULL and sends RTSP TEARDOWN; killed sessions linger on
      the TP-Link cameras and use up their small concurrent-stream limit.
    - Publishes per-camera fps (retained) to jetson/detector/state on the
      local broker for the Home Assistant health sensors.
    - --wait-mqtt: wait until the local MQTT broker (sidecar) accepts a
      connection.
    """
    import json
    import os
    import re
    import signal
    import socket
    import struct
    import subprocess
    import sys
    import threading
    import time

    STALL_SEC = int(os.environ.get("STALL_SEC", "600"))
    RESTART_DELAY = int(os.environ.get("RESTART_DELAY", "90"))
    PERF = re.compile(r"([0-9.]+) \(([0-9.]+)\)")


    def _s(v):
        b = v.encode()
        return struct.pack("!H", len(b)) + b


    def _remaining(n):
        out = b""
        while True:
            d, n = n % 128, n // 128
            out += bytes([d | (0x80 if n else 0)])
            if not n:
                return out


    def mqtt_publish(topic, payload, retain=True):
        """One-shot MQTT 3.1.1 publish (QoS 0) to the local broker."""
        conn = _s("MQTT") + bytes([4, 0x02]) + struct.pack("!H", 30) + _s("jetson-detector-state")
        pub = _s(topic) + payload.encode()
        try:
            with socket.create_connection(
                    (os.environ["MQTT_HOST"], int(os.environ["MQTT_PORT"])), timeout=5) as c:
                c.sendall(bytes([0x10]) + _remaining(len(conn)) + conn)
                c.recv(4)
                c.sendall(bytes([0x31 if retain else 0x30]) + _remaining(len(pub)) + pub)
                c.sendall(bytes([0xE0, 0]))
        except OSError as e:
            print(f"supervisor: state publish failed: {e}", flush=True)


    def wait_mqtt():
        conn = _s("MQTT") + bytes([4, 0x02]) + struct.pack("!H", 30) + _s("jetson-detector-wait")
        for _ in range(120):
            try:
                with socket.create_connection(
                        (os.environ["MQTT_HOST"], int(os.environ["MQTT_PORT"])), timeout=5) as c:
                    c.sendall(bytes([0x10]) + _remaining(len(conn)) + conn)
                    if c.recv(4)[:1] == b"\x20":
                        c.sendall(bytes([0xE0, 0]))
                        return 0
            except OSError:
                pass
            time.sleep(1)
        print("local MQTT broker not reachable", flush=True)
        return 1


    def main(cfg):
        proc = subprocess.Popen(["deepstream-app", "-c", cfg], stdout=subprocess.PIPE,
                                stderr=subprocess.STDOUT, text=True, bufsize=1)
        zero_since = {}
        cams = open("/tmp/cams.txt").read().split()

        def reader():
            for line in proc.stdout:
                sys.stdout.write(line)
                sys.stdout.flush()
                if not line.startswith("**PERF:") or "FPS" in line:
                    continue
                now = time.monotonic()
                fps = PERF.findall(line)
                for i, (cur, _avg) in enumerate(fps):
                    if float(cur) > 0:
                        zero_since.pop(i, None)
                    else:
                        zero_since.setdefault(i, now)
                state = {cams[i] if i < len(cams) else f"cam{i}": round(float(cur), 1)
                         for i, (cur, _avg) in enumerate(fps)}
                state["ts"] = int(time.time())
                mqtt_publish("jetson/detector/state", json.dumps(state))

        def stop(reason, code, delay=0):
            print(f"supervisor: {reason}; stopping deepstream-app", flush=True)
            if proc.poll() is None:
                proc.send_signal(signal.SIGINT)
                try:
                    proc.wait(timeout=20)
                except subprocess.TimeoutExpired:
                    proc.kill()
            if delay:
                print(f"supervisor: waiting {delay}s for the cameras to free sessions", flush=True)
                time.sleep(delay)
            sys.exit(code)

        signal.signal(signal.SIGTERM, lambda *_: stop("SIGTERM", 0))
        threading.Thread(target=reader, daemon=True).start()
        started = time.monotonic()
        while proc.poll() is None:
            time.sleep(5)
            now = time.monotonic()
            # Before any camera produced frames, allow STALL_SEC from start.
            for i, t0 in list(zero_since.items()):
                if now - max(t0, started) > STALL_SEC:
                    stop(f"camera {i} at 0 fps for {STALL_SEC}s", 1, RESTART_DELAY)
        sys.exit(proc.returncode or 1)


    if __name__ == "__main__":
        if sys.argv[1] == "--wait-mqtt":
            sys.exit(wait_mqtt())
        main(sys.argv[1])

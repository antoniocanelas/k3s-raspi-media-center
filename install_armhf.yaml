    # deepstream-app exits if the broker refuses the connection, so check the
    # login first and run without the MQTT sink (detection only) if it fails;
    # supervisor.py then restarts later to retry.
    export MQTT_HOST="${MQTT_HOST:-192.168.0.100}" MQTT_PORT="${MQTT_PORT:-1883}"

# LLM inference on jetson-orin-01: Ollama (dustynv Jetson build, CUDA 12.6 =
# JetPack 6.2) with an OpenAI-compatible API (/v1) plus the native Ollama API
# used by the Home Assistant Ollama integration.
# Models live on the Jetson NVMe (jetson-ai-pvc, /models/ollama); the ones in
# PULL_MODELS are pulled at start if missing. Only one model is loaded at a
# time and it stays loaded (keep_alive -1) so answers start immediately.
# Memory budget (8 GB shared CPU/GPU, people-detector also on the GPU):
# 3-4B Q4 models fit next to the video pipeline; 7-8B models do not.
# GPU access: runtimeClassName nvidia (no device plugin on the Orin).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  namespace: ai
  labels:
    app: llm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm
  template:
    metadata:
      labels:
        app: llm
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: jetson-orin-01
      tolerations:
      - key: workload
        operator: Equal
        value: jetson
        effect: NoSchedule
      containers:
      - name: ollama
        image: dustynv/ollama:0.6.8-r36.4-cu126-22.04
        command:
        - bash
        - -c
        - |
          ollama serve &
          pid=$!
          until ollama list >/dev/null 2>&1; do sleep 1; done
          for m in $PULL_MODELS; do
            ollama show "$m" >/dev/null 2>&1 || ollama pull "$m"
          done
          wait $pid
        env:
        - name: OLLAMA_HOST
          value: 0.0.0.0:11434
        - name: OLLAMA_MODELS
          value: /models/ollama
        - name: OLLAMA_KEEP_ALIVE
          value: "-1"
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "1"
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        - name: OLLAMA_CONTEXT_LENGTH
          value: "4096"
        - name: PULL_MODELS
          value: qwen2.5:3b qwen3:4b
        ports:
        - name: http
          containerPort: 11434
        readinessProbe:
          httpGet:
            path: /api/version
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/version
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 5Gi
        volumeMounts:
        - name: models
          mountPath: /models
          subPath: models
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: jetson-ai-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: llm
  namespace: ai
  labels:
    app: llm
spec:
  selector:
    app: llm
  ports:
  - name: http
    port: 8080
    targetPort: http
---
# LAN only, no auth. Only chat/inference endpoints are routed: the Ollama API
# also allows pulling and deleting models (/api/pull, /api/delete, ...), which
# must not be reachable from the LAN.
#   http://llm.telheira/v1/chat/completions   (OpenAI-compatible clients)
#   http://192.168.0.240                      (Home Assistant Ollama integration)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: llm
  namespace: ai
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: >-
      (Host(`llm.telheira`) || Host(`192.168.0.240`)) &&
      (PathPrefix(`/v1/`) || Path(`/api/chat`) || Path(`/api/generate`) ||
      Path(`/api/tags`) || Path(`/api/show`) || Path(`/api/version`) ||
      Path(`/api/ps`) || Path(`/`))
    services:
    - kind: Service
      name: llm
      port: 8080

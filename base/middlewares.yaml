---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-jellyfin
spec:
  stripPrefix:
    prefixes:
      - /jellyfin
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jellyfin-redirect
spec:
  redirectRegex:
    regex: ^https?://([^/]+)/jellyfin$
    replacement: https://$1/jellyfin/web/
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-qbittorrent
spec:
  stripPrefix:
    prefixes:
      - /qbittorrent


apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: llm
  name: llm
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: llm
    spec:
      containers:
      - command:
        - bash
        - -c
        - |
          ollama serve &
          pid=$!
          until ollama list >/dev/null 2>&1; do sleep 1; done
          for m in $PULL_MODELS; do
            ollama show "$m" >/dev/null 2>&1 || ollama pull "$m"
          done
          # qwen3-jetson = qwen3:4b-instruct without mmap. On the Orin (CPU and
          # GPU share RAM) a mmapped model stays resident twice: ~4.2 GB on the
          # GPU plus ~2.5 GB of mapped file. use_mmap false saves ~1.9 GB.
          # num_gpu 99 forces every layer onto the GPU: Ollama estimates free
          # GPU memory with the page cache counted as used (Jetson unified
          # memory) and otherwise splits the model ~50/50 with the CPU.
          printf 'FROM qwen3:4b-instruct\nPARAMETER use_mmap false\nPARAMETER num_ctx 8192\nPARAMETER num_gpu 99\n' > /tmp/Modelfile.qwen3-jetson
          ollama create qwen3-jetson -f /tmp/Modelfile.qwen3-jetson
          # assist-jetson = the model the HA agent uses (generic name, so HA does
          # not change when the base model changes). Since 2026-10-10 it is
          # qwen2.5:3b (~2.5 GB with context instead of ~3.3 GB for qwen3 4B):
          # Frigate face recognition (large) left the Jetson out of memory.
          printf 'FROM qwen2.5:3b\nPARAMETER use_mmap false\nPARAMETER num_ctx 8192\nPARAMETER num_gpu 99\n' > /tmp/Modelfile.assist-jetson
          ollama create assist-jetson -f /tmp/Modelfile.assist-jetson
          # Load the HA agent's model right away and keep it (empty prompt =
          # load only). Plain HTTP over bash: the image has no curl, and
          # "ollama run" with an empty prompt does not load anything.
          body='{"model":"assist-jetson:latest","prompt":"","keep_alive":-1}'
          exec 3<>/dev/tcp/127.0.0.1/11434
          printf 'POST /api/generate HTTP/1.0\r\nContent-Type: application/json\r\nContent-Length: %s\r\n\r\n%s' "${#body}" "$body" >&3
          head -1 <&3 || true
          exec 3>&-
          wait $pid
        env:
        - name: OLLAMA_HOST
          value: 0.0.0.0:11434
        - name: OLLAMA_MODELS
          value: /models/ollama
        - name: OLLAMA_KEEP_ALIVE
          value: "-1"
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "1"
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        - name: OLLAMA_FLASH_ATTENTION
          value: "1"
        - name: OLLAMA_KV_CACHE_TYPE
          value: q8_0
        - name: LLAMA_ARG_CACHE_RAM
          value: "0"
        - name: OLLAMA_CONTEXT_LENGTH
          value: "8192"
        - name: PULL_MODELS
          value: qwen3:4b-instruct qwen2.5:3b
        image: ollama/ollama:0.35.1
        livenessProbe:
          httpGet:
            path: /api/version
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
        name: ollama
        ports:
        - containerPort: 11434
          name: http
        readinessProbe:
          httpGet:
            path: /api/version
            port: http
          periodSeconds: 10
        resources:
          limits:
            memory: 5Gi
          requests:
            cpu: 500m
            memory: 2Gi
        volumeMounts:
        - mountPath: /models
          name: models
          subPath: models
      nodeSelector:
        kubernetes.io/hostname: jetson-orin-01
      runtimeClassName: nvidia
      tolerations:
      - effect: NoSchedule
        key: workload
        operator: Equal
        value: jetson
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: jetson-ai-pvc
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: frigate-backup
  namespace: ai
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        spec:
          containers:
          - command:
            - sh
            - -c
            - |
              set -eu
              apk add --no-cache sqlite >/dev/null
              dest="/backup/frigate-backup/$(date +%Y-%m-%d)"
              mkdir -p "$dest"
              # Consistent copy of the live SQLite database (WAL mode).
              sqlite3 /src/config/frigate.db ".backup '$dest/frigate.db'"
              tar -C /src/config -czf "$dest/config.tgz" \
                --exclude=./model_cache --exclude='./frigate.db*' --exclude=./backup.db .
              tar -C /src/faces -czf "$dest/faces.tgz" .
              ls -1d /backup/frigate-backup/20*/ | sort | head -n -14 | xargs -r rm -rf
              echo "frigate-backup: $(du -sh "$dest" | cut -f1) in $dest"
            image: alpine:3.20.3
            name: backup
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 10m
                memory: 32Mi
            volumeMounts:
            - mountPath: /src/config
              name: data
              readOnly: true
              subPath: frigate/config
            - mountPath: /src/faces
              name: data
              readOnly: true
              subPath: frigate/media/clips/faces
            - mountPath: /backup
              name: backup
          nodeSelector:
            kubernetes.io/hostname: jetson-orin-01
          restartPolicy: Never
          tolerations:
          - effect: NoSchedule
            key: workload
            operator: Equal
            value: jetson
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: jetson-ai-pvc
          - name: backup
            nfs:
              path: /volume1/raspik8sconf
              server: 192.168.0.200
  schedule: 30 4 * * *
  successfulJobsHistoryLimit: 1
---

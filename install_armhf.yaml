apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: media
    run: bazarr
  name: bazarr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media
      run: bazarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: media
        run: bazarr
    spec:
      containers:
      - env:
        - name: TZ
          value: Europe/Lisbon
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        image: linuxserver/bazarr:v1.6.0-ls354
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /bazarr
            port: webui
          periodSeconds: 20
          timeoutSeconds: 5
        name: bazarr
        ports:
        - containerPort: 6767
          name: webui
        readinessProbe:
          failureThreshold: 12
          httpGet:
            path: /bazarr
            port: webui
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /bazarr
            port: webui
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /config
          name: config
          subPath: bazarr
        - mountPath: /movies
          name: media
          subPath: movies
        - mountPath: /tv
          name: media
          subPath: tv
      initContainers:
      - command:
        - sh
        - -c
        - |
          set -e
          mkdir -p /config/bazarr/config /config/config
          RADARR_API_KEY=$(cat config/radarr/config.xml 2>/dev/null | sed -ne "/ApiKey/{s/.*<ApiKey>\(.*\)<\/ApiKey>.*/\1/p;q;}" || true)
          SONARR_API_KEY=$(cat config/sonarr/config.xml 2>/dev/null | sed -ne "/ApiKey/{s/.*<ApiKey>\(.*\)<\/ApiKey>.*/\1/p;q;}" || true)

          printf '%s\n' '---' 'general:' '  base_url: /bazarr' '  enabled_integrations:' '    - sonarr' '    - radarr' '  serie_default_enabled: true' '  movie_default_enabled: true' '  port: 6767' '  use_radarr: true' '  use_sonarr: true' '  use_embedded_subs: true' '  upgrade_subs: true' '  wanted_search_frequency: 6' > /config/bazarr/config/config.yaml
          cp /config/bazarr/config/config.yaml /config/config/config.yaml || true
          chown -R 1000:1000 /config/bazarr/config /config/config || true
        image: busybox
        imagePullPolicy: IfNotPresent
        name: config
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /movies
          name: media
          subPath: media/movies
        - mountPath: /tv
          name: media
          subPath: media/tv
      - command:
        - sh
        - -c
        - |
          until nc -z sonarr 8989 >/dev/null 2>&1 && nc -z radarr 7878 >/dev/null 2>&1; do
            echo "waiting for sonarr and radarr (tcp)"
            sleep 2
          done
        image: busybox
        imagePullPolicy: IfNotPresent
        name: wait-for-sonarr-and-radarr
      securityContext:
        fsGroup: 1000
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: ssd-config-pvc
      - name: downloads
        persistentVolumeClaim:
          claimName: ssd-downloads-pvc
      - name: media
        persistentVolumeClaim:
          claimName: nas-media-pvc

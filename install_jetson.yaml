            Baixa qualidade: cam60
        ffmpeg:
          inputs:
            - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@go2rtc.ai.svc.cluster.local:8554/cam60
              roles: [detect]
            - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@go2rtc.ai.svc.cluster.local:8554/cam60_hd
              roles: [record]
      cam62:
        friendly_name: Porta
        live:
          streams:
            Alta qualidade: cam62_hd
            Baixa qualidade: cam62
        # Plants along the passage kept triggering motion; the path itself
        # stays unmasked (people walk there). Pixels of the 1280x720 detect frame.
        motion:
          mask:
            jardim_fundo:
              friendly_name: Palmeira e jardim ao fundo
              enabled: true
              coordinates: "400,0,880,0,880,75,400,75"
            canteiro:
              friendly_name: Canteiro a esquerda
              enabled: true
              coordinates: "410,225,540,225,670,720,430,720"
            vasos:
              friendly_name: Vasos a direita
              enabled: true
              coordinates: "824,338,1010,338,1010,638,824,638"
            plantas_baixo:
              friendly_name: Plantas em baixo a direita
              enabled: true
              coordinates: "960,555,1280,555,1280,720,960,720"
        ffmpeg:
          inputs:
            - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@go2rtc.ai.svc.cluster.local:8554/cam62_hd
              roles: [detect, record]
        # Detect on the main stream at 1280x720 (since 2026-10-09) so faces have
        # enough pixels for face recognition. The main stream is 2560x1440
        # (Portao after fw 2.2.3); Frigate scales it down (~10% of a core,
        # ~-165 MB RAM measured). 1440p detect would cost ~200-300 MB more.
        # Masks are pixels of this 1280x720 frame (converted from the old

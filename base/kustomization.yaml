apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: media

# NOTE (2026-07-10): this file previously built a stack that never matched
# the live cluster - a global `app: htpc` label, jackett/transmission/readarr
# /kavita/lidarr (none of which run live), and a single arr-data-pvc that
# doesn't exist. It has been reconciled to match what's actually deployed.
# See git history for the prior version and base/*/deployment.yaml removed
# from this list if you want to bring a component back.
resources:
- namespace.yaml
- storage.yaml
- bazarr
- changedetection
- prowlarr
- qbittorrent
- radarr
- sonarr
- tailscale
- jellyfin
- homeassistant
- plex
- ingress-routes.yaml
- middlewares.yaml

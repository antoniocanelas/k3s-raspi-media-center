    """Run deepstream-app and keep it healthy.

    - Restarts (exit 1) when any camera reports 0 fps for STALL_SEC: with
      uridecodebin a source whose RTSP session stalls never recovers by itself.
      The TP-Link cameras only serve a few concurrent streams and keep dead
      sessions until they time out, so restarts are rare (10 min) and wait
      RESTART_DELAY after stopping, letting the cameras free the sessions
      before the next start reconnects.
    - Stops deepstream-app with SIGINT (on SIGTERM or before a restart) so the
      pipeline goes to NULL and sends RTSP TEARDOWN; killed sessions linger on
      the TP-Link cameras and use up their small concurrent-stream limit.
    - With MQTT_STATE=retry (broker check failed at start), exits after
      MQTT_RETRY_SEC so the next start retries the broker.
    - --check-mqtt: MQTT 3.1.1 CONNECT with MQTT_USER/MQTT_PASS, exit 0 if
      the broker accepts the login.
    """
    import os
    import re
    import signal
    import socket
    import struct
    import subprocess
    import sys
    import threading
    import time

    STALL_SEC = int(os.environ.get("STALL_SEC", "600"))
    RESTART_DELAY = int(os.environ.get("RESTART_DELAY", "90"))
    MQTT_RETRY_SEC = int(os.environ.get("MQTT_RETRY_SEC", "900"))
    PERF = re.compile(r"([0-9.]+) \(([0-9.]+)\)")


    def check_mqtt():
        def s(v):
            b = v.encode()
            return struct.pack("!H", len(b)) + b
        user, pw = os.environ["MQTT_USER"], os.environ.get("MQTT_PASS", "")
        var = s("MQTT") + bytes([4, 0xC2]) + struct.pack("!H", 30)
        payload = s("jetson-people-detector-check") + s(user) + s(pw)
        body = var + payload
        try:
            with socket.create_connection(
                    (os.environ["MQTT_HOST"], int(os.environ["MQTT_PORT"])), timeout=5) as c:
                c.sendall(bytes([0x10, len(body)]) + body)
                ack = c.recv(4)
                c.sendall(bytes([0xE0, 0]))
        except OSError as e:
            print(f"mqtt check: {e}", flush=True)
            return 1
        rc = ack[3] if len(ack) == 4 and ack[0] == 0x20 else -1
        print(f"mqtt check: CONNACK {rc}", flush=True)
        return 0 if rc == 0 else 1


    def main(cfg):
        proc = subprocess.Popen(["deepstream-app", "-c", cfg], stdout=subprocess.PIPE,
                                stderr=subprocess.STDOUT, text=True, bufsize=1)
        zero_since = {}

        def reader():
            for line in proc.stdout:
                sys.stdout.write(line)
                sys.stdout.flush()
                if not line.startswith("**PERF:") or "FPS" in line:
                    continue
                now = time.monotonic()
                for i, (cur, _avg) in enumerate(PERF.findall(line)):
                    if float(cur) > 0:
                        zero_since.pop(i, None)
                    else:
                        zero_since.setdefault(i, now)

        def stop(reason, code, delay=0):
            print(f"supervisor: {reason}; stopping deepstream-app", flush=True)
            if proc.poll() is None:
                proc.send_signal(signal.SIGINT)
                try:
                    proc.wait(timeout=20)
                except subprocess.TimeoutExpired:
                    proc.kill()
            if delay:
                print(f"supervisor: waiting {delay}s for the cameras to free sessions", flush=True)
                time.sleep(delay)
            sys.exit(code)

        signal.signal(signal.SIGTERM, lambda *_: stop("SIGTERM", 0))
        threading.Thread(target=reader, daemon=True).start()
        started = time.monotonic()
        while proc.poll() is None:
            time.sleep(5)
            now = time.monotonic()
            # Before any camera produced frames, allow STALL_SEC from start.
            for i, t0 in list(zero_since.items()):
                if now - max(t0, started) > STALL_SEC:
                    stop(f"camera {i} at 0 fps for {STALL_SEC}s", 1, RESTART_DELAY)
            if os.environ.get("MQTT_STATE") == "retry" and now - started > MQTT_RETRY_SEC:
                stop("retrying MQTT broker", 0, RESTART_DELAY)
        sys.exit(proc.returncode or 1)


    if __name__ == "__main__":
        if sys.argv[1] == "--check-mqtt":
            sys.exit(check_mqtt())
        main(sys.argv[1])

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: people-detector
  name: people-detector
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: people-detector
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: people-detector
    spec:
      containers:
      - command:
        - bash
        - /config/run.sh
        envFrom:
        - secretRef:
            name: camera-rtsp
            optional: true
        - secretRef:
            name: mqtt
            optional: true
        image: nvcr.io/nvidia/deepstream:7.1-samples-multiarch
        name: deepstream
        resources:
          limits:
            memory: 3Gi
          requests:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /models
          name: models
          subPath: models
      initContainers:
      - command:
        - sh
        - -c
        - |
          if ls /models/deepstream/peoplenet/*.engine >/dev/null 2>&1; then exit 0; fi
          sync && echo 3 > /proc/sys/vm/drop_caches
        image: busybox:1.36
        name: drop-caches
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /models
          name: models
          subPath: models
      nodeSelector:
        kubernetes.io/hostname: jetson-orin-01
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 40
      tolerations:
      - effect: NoSchedule
        key: workload
        operator: Equal
        value: jetson
      volumes:
      - configMap:
          name: people-detector
        name: config
      - name: models
        persistentVolumeClaim:
          claimName: jetson-ai-pvc

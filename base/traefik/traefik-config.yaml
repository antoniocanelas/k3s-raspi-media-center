apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  failurePolicy: reinstall
  valuesContent: |-
    # Keep the client IP: with the default externalTrafficPolicy Cluster the
    # service NATs the source and Home Assistant sees every external request as
    # the svclb pod (10.42.x), so its login ban would block everyone. Local
    # needs Traefik on the node the router forwards to (pi-master-00), hence
    # the nodeSelector.
    service:
      spec:
        externalTrafficPolicy: Local
    nodeSelector:
      kubernetes.io/hostname: pi-master-00
    additionalArguments:
      - "--certificatesresolvers.letsencrypt.acme.email=antoniocanelas@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      # ZeroSSL (used by the external routes): Let's Encrypt kept failing on
      # telheira.tplinkdns.com because of TP-Link DNS bugs (see
      # TLS_CERTIFICATES.md). EAB credentials come from Secret
      # kube-system/traefik-zerossl-eab via env (expanded by Kubernetes).
      - "--certificatesresolvers.zerossl.acme.email=antoniocanelas@gmail.com"
      - "--certificatesresolvers.zerossl.acme.storage=/data/acme-zerossl.json"
      - "--certificatesresolvers.zerossl.acme.caserver=https://acme.zerossl.com/v2/DV90"
      - "--certificatesresolvers.zerossl.acme.eab.kid=$(ZEROSSL_EAB_KID)"
      - "--certificatesresolvers.zerossl.acme.eab.hmacencoded=$(ZEROSSL_EAB_HMAC)"
      - "--certificatesresolvers.zerossl.acme.httpchallenge=true"
      - "--certificatesresolvers.zerossl.acme.httpchallenge.entrypoint=web"

    env:
      - name: ZEROSSL_EAB_KID
        valueFrom:
          secretKeyRef:
            name: traefik-zerossl-eab
            key: EAB_KID
      - name: ZEROSSL_EAB_HMAC
        valueFrom:
          secretKeyRef:
            name: traefik-zerossl-eab
            key: EAB_HMAC

    # acme.json must survive restarts: with the chart default (emptyDir) every
    # Traefik restart re-requests all certificates, and a restart during a
    # tplinkdns DNS hiccup leaves the external endpoints with no valid cert.
    persistence:
      enabled: true
      name: data
      accessMode: ReadWriteOnce
      size: 128Mi
      path: /data
      storageClass: "local-path"

    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
              - pi-master-00

    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
      websecure:
        tls:
          enabled: true
      homeassistantsecure:
        port: 8123
        exposedPort: 8123
        expose:
          default: true
        protocol: TCP
        tls:
          enabled: true
      plexsecure:
        port: 32443
        exposedPort: 32443
        expose:
          default: true
        protocol: TCP
        tls:
          enabled: true

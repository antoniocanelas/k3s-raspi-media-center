          periodSeconds: 30
        name: llama-server
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        resources:
          limits:
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1536Mi
        volumeMounts:
        - mountPath: /models
          name: models
          readOnly: true
          subPath: models
      initContainers:
      - command:
        - sh
        - -c
        - |
          set -e
          if [ -s "$MODEL_FILE" ]; then echo "model present"; exit 0; fi
          curl -fL --retry 5 -o "$MODEL_FILE.part" "$MODEL_URL"
          mv "$MODEL_FILE.part" "$MODEL_FILE"
        env:
        - name: MODEL_URL
          value: https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
        - name: MODEL_FILE
          value: /models/qwen2.5-1.5b-instruct-q4_k_m.gguf
        image: curlimages/curl:8.10.1
        name: fetch-model
        securityContext:
          runAsUser: 0
        volumeMounts:
        - mountPath: /models
          name: models
          subPath: models
      nodeSelector:
        kubernetes.io/hostname: jetson-orin-01
      runtimeClassName: nvidia
      tolerations:
      - effect: NoSchedule
        key: workload
        operator: Equal
        value: jetson
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: jetson-ai-pvc

apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-media-pv
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.0.200
    path: /volume1/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nas-media-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  volumeName: nas-media-pv
  resources:
    requests:
      storage: 1Ti
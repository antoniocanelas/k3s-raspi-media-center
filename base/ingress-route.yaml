apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: media
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`qbittorrent.telheira`)
      priority: 1
      services:
        - kind: Service
          name: qbittorrent
          namespace: media
          port: 8080
    - kind: Rule
      match: Host(`qbittorrent.telheira`) && PathPrefix(`/prowlarr`)
      priority: 100
      services:
        - kind: Service
          name: prowlarr
          namespace: media
          port: 9696
    - kind: Rule
      match: Host(`qbittorrent.telheira`) && PathPrefix(`/radarr`)
      priority: 100
      services:
        - kind: Service
          name: radarr
          namespace: media
          port: 7878
    - kind: Rule
      match: Host(`qbittorrent.telheira`) && PathPrefix(`/sonarr`)
      priority: 100
      services:
        - kind: Service
          name: sonarr
          namespace: media
          port: 8989
    - kind: Rule
      match: Host(`qbittorrent.telheira`) && PathPrefix(`/bazarr`)
      priority: 200
      middlewares:
        - name: redirect-bazarr-to-subdomain
          namespace: media
      services:
        - kind: Service
          name: qbittorrent
          namespace: media
          port: 8080
    - kind: Rule
      match: Host(`bazarr.telheira`)
      priority: 5
      services:
        - kind: Service
          name: bazarr
          namespace: media
          port: 6767
    - kind: Rule
      match: Host(`ha.telheira`)
      priority: 5
      services:
        - kind: Service
          name: homeassistant-external
          namespace: media
          port: 8123
    - kind: Rule
      match: Host(`jellyfin.telheira`)
      priority: 5
      services:
        - kind: Service
          name: jellyfin-external
          namespace: media
          port: 8096
    - kind: Rule
      match: Host(`plex.telheira`)
      priority: 5
      services:
        - kind: Service
          name: plex-external
          namespace: media
          port: 32400

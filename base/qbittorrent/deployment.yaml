---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: qbittorrent
  name: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      run: qbittorrent
  template:
    metadata:
      labels:
        run: qbittorrent
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: config
        image: busybox
        command: ["sh", "-c"]
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        args:
        - |
          mkdir -p /config/qBittorrent
          if [ ! -f /config/qBittorrent/qBittorrent.conf ]; then
            cat <<'EOF' > /config/qBittorrent/qBittorrent.conf
            [BitTorrent]
            Session\DefaultSavePath=/downloads/completed
            Session\GlobalMaxRatio=0
            Session\MaxRatioAction=0
            Session\TempPath=/downloads/incomplete
            Session\TempPathEnabled=true

            [Preferences]
            WebUI\AuthSubnetWhitelist=192.168.0.0/24
            WebUI\Address=*
            WebUI\Port=8080
            EOF
          fi
        volumeMounts:
        - mountPath: /config
          name: config
          subPath: qbittorrent
#      initContainers:
#      - name: chown
#        image: busybox
#        command: ["sh", "-c", "chown -R 1000:1000 /config && chown -R 1000:1000 /downloads && chown -R 1000:1000 /media && chown -R 1000:1000 /watch"]
#        volumeMounts:
#        - mountPath: /config
#          name: media-config
#          subPath: qbittorrent
#        - mountPath: /downloads
#          name: media
#          subPath: downloads
#        - mountPath: /watch
#          name: media
#          subPath: watch
#        - mountPath: /media
#          name: media
#          subPath: media
      containers:
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent
        env:
        - name: TZ
          value: Europe/Lisbon
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: WEBUI_PORT
          value: "8080"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        ports:
        - containerPort: 8080
          name: webui
          protocol: TCP
        - containerPort: 6881
          name: qbittorrent-tcp
          protocol: TCP
        - containerPort: 6881
          name: qbittorrent-udp
          protocol: UDP
        volumeMounts:
          - name: config
            mountPath: /config
            subPath: qbittorrent
          - name: downloads
            mountPath: /downloads
#          - mountPath: /watch
#            name: downloads
#            subPath: watch
          - name: media
            mountPath: /media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: ssd-config-pvc
        - name: downloads
          persistentVolumeClaim:
            claimName: ssd-downloads-pvc
        - name: media
          persistentVolumeClaim:
            claimName: nas-media-pvc

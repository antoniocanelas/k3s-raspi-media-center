# NOTE: tailscale's TS_STATE_DIR points at a PVC path (not the Kubernetes API
# state store), so this ServiceAccount does not appear to need any RBAC grants
# to function. Captured as-is because the Deployment references it by name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale
  namespace: media
  labels:
    app: media

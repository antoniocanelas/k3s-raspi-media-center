# All Traefik IngressRoutes actually deployed on the live cluster. Created
# ad-hoc via kubectl apply over time and only reconciled back into this repo
# on 2026-07-10. Replaces the old base/ingress-route.yaml ("htpc" IngressRoute),
# which was never actually deployed and referenced components that don't run
# (jackett, transmission, readarr, kavita, lidarr).
#
# NOTE: homeassistant-external and plex-external route to Services with zero
# live endpoints (see base/homeassistant, base/plex, base/jellyfin/service-external.yaml).
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels:
    app: media
  name: media
  namespace: media
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: Host(`qbittorrent.telheira`)
    priority: 1
    services:
    - kind: Service
      name: qbittorrent
      namespace: media
      port: 8080
  - kind: Rule
    match: Host(`qbittorrent.telheira`) && PathPrefix(`/prowlarr`)
    priority: 100
    services:
    - kind: Service
      name: prowlarr
      namespace: media
      port: 9696
  - kind: Rule
    match: Host(`qbittorrent.telheira`) && PathPrefix(`/radarr`)
    priority: 100
    services:
    - kind: Service
      name: radarr
      namespace: media
      port: 7878
  - kind: Rule
    match: Host(`qbittorrent.telheira`) && PathPrefix(`/sonarr`)
    priority: 100
    services:
    - kind: Service
      name: sonarr
      namespace: media
      port: 8989
  - kind: Rule
    match: Host(`qbittorrent.telheira`) && PathPrefix(`/bazarr`)
    middlewares:
    - name: redirect-bazarr-to-subdomain
      namespace: media
    priority: 200
    services:
    - kind: Service
      name: qbittorrent
      namespace: media
      port: 8080
  - kind: Rule
    match: Host(`bazarr.telheira`)
    priority: 5
    services:
    - kind: Service
      name: bazarr
      namespace: media
      port: 6767
  - kind: Rule
    match: Host(`ha.telheira`)
    priority: 5
    services:
    - kind: Service
      name: homeassistant-external
      namespace: media
      port: 8123
  - kind: Rule
    match: Host(`jellyfin.telheira`)
    priority: 5
    services:
    - kind: Service
      name: jellyfin-external
      namespace: media
      port: 8096
  - kind: Rule
    match: Host(`plex.telheira`)
    priority: 5
    services:
    - kind: Service
      name: plex-external
      namespace: media
      port: 32400
  - kind: Rule
    match: PathPrefix(`/sonarr`)
    priority: 1
    services:
    - kind: Service
      name: sonarr
      namespace: media
      port: 8989
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  annotations: {}
  labels:
    app: media
  name: media-external
  namespace: media
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`telheira.tplinkdns.com`) && PathPrefix(`/prowlarr`)
    priority: 200
    services:
    - kind: Service
      name: prowlarr
      namespace: media
      port: 9696
  - kind: Rule
    match: Host(`telheira.tplinkdns.com`) && PathPrefix(`/radarr`)
    priority: 200
    services:
    - kind: Service
      name: radarr
      namespace: media
      port: 7878
  - kind: Rule
    match: Host(`telheira.tplinkdns.com`) && PathPrefix(`/sonarr`)
    priority: 200
    services:
    - kind: Service
      name: sonarr
      namespace: media
      port: 8989
  - kind: Rule
    match: Host(`telheira.tplinkdns.com`) && PathPrefix(`/bazarr`)
    priority: 200
    services:
    - kind: Service
      name: bazarr
      namespace: media
      port: 6767
  - kind: Rule
    match: Host(`telheira.tplinkdns.com`) && PathPrefix(`/jellyfin`)
    middlewares:
    - name: jellyfin-redirect
      namespace: media
    - name: strip-jellyfin
      namespace: media
    priority: 200
    services:
    - kind: Service
      name: jellyfin-external
      namespace: media
      port: 8096
  - kind: Rule
    match: Host(`telheira.tplinkdns.com`) && PathPrefix(`/qbittorrent`)
    middlewares:
    - name: strip-qbittorrent
      namespace: media
    priority: 200
    services:
    - kind: Service
      name: qbittorrent
      namespace: media
      port: 8080
  - kind: Rule
    match: Host(`telheira.tplinkdns.com`)
    priority: 1
    services:
    - kind: Service
      name: qbittorrent
      namespace: media
      port: 8080
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  annotations: {}
  labels:
    app: media
  name: plex-external
  namespace: media
spec:
  entryPoints:
  - plexsecure
  routes:
  - kind: Rule
    match: Host(`telheira.tplinkdns.com`)
    priority: 1
    services:
    - kind: Service
      name: plex-external
      namespace: media
      port: 32400
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  annotations: {}
  labels:
    app: media
  name: plex-subdomain
  namespace: media
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`plex.telheira.tplinkdns.com`)
    priority: 100
    services:
    - kind: Service
      name: plex-external
      namespace: media
      port: 32400
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  annotations: {}
  labels:
    app: media
  name: homeassistant-external
  namespace: media
spec:
  entryPoints:
  - homeassistantsecure
  routes:
  - kind: Rule
    match: Host(`telheira.tplinkdns.com`)
    priority: 1
    services:
    - kind: Service
      name: homeassistant-external
      namespace: media
      port: 8123
  tls:
    certResolver: letsencrypt

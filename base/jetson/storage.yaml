apiVersion: v1
kind: PersistentVolume
metadata:
  name: jetson-ai-pv
  labels:
    app: jetson-ai
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: jetson-local
  local:
    path: /var/lib/jetson-data/ai
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - jetson-orin-01
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jetson-ai-pvc
  namespace: ai
  labels:
    app: jetson-ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: jetson-local
  volumeName: jetson-ai-pv
  resources:
    requests:
      storage: 50Gi

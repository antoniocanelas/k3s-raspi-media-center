# LLM inference on jetson-orin-01: official Ollama image (ships a JetPack 6
# CUDA build, cuda_jetpack6, works with the JetPack 6.2 driver 12.6) with an
# OpenAI-compatible API (/v1) plus the native Ollama API used by the Home
# Assistant Ollama integration. The dustynv 0.6.8 build used first could not
# switch Qwen3 thinking off (minutes per answer).
# Models live on the Jetson NVMe (jetson-ai-pvc, /models/ollama); the ones in
# PULL_MODELS are pulled at start if missing. Only one model is loaded at a
# time and it stays loaded (keep_alive -1) so answers start immediately.
# Memory budget (8 GB shared CPU/GPU, Frigate also on the GPU):
# 3-4B Q4 models fit next to the video pipeline; 7-8B models do not.
# GPU access: runtimeClassName nvidia (no device plugin on the Orin).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  namespace: ai
  labels:
    app: llm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm
  template:
    metadata:
      labels:
        app: llm
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: jetson-orin-01
      tolerations:
      - key: workload
        operator: Equal
        value: jetson
        effect: NoSchedule
      containers:
      - name: ollama
        image: ollama/ollama:0.35.1
        command:
        - bash
        - -c
        - |
          ollama serve &
          pid=$!
          until ollama list >/dev/null 2>&1; do sleep 1; done
          for m in $PULL_MODELS; do
            ollama show "$m" >/dev/null 2>&1 || ollama pull "$m"
          done
          # qwen3-jetson = qwen3:4b-instruct without mmap. On the Orin (CPU and
          # GPU share RAM) a mmapped model stays resident twice: ~4.2 GB on the
          # GPU plus ~2.5 GB of mapped file. use_mmap false saves ~1.9 GB.
          # num_gpu 99 forces every layer onto the GPU: Ollama estimates free
          # GPU memory with the page cache counted as used (Jetson unified
          # memory) and otherwise splits the model ~50/50 with the CPU.
          printf 'FROM qwen3:4b-instruct\nPARAMETER use_mmap false\nPARAMETER num_ctx 8192\nPARAMETER num_gpu 99\n' > /tmp/Modelfile.qwen3-jetson
          ollama create qwen3-jetson -f /tmp/Modelfile.qwen3-jetson
          # Load the HA agent's model right away and keep it (empty prompt =
          # load only). Plain HTTP over bash: the image has no curl, and
          # "ollama run" with an empty prompt does not load anything.
          body='{"model":"qwen3-jetson:latest","prompt":"","keep_alive":-1}'
          exec 3<>/dev/tcp/127.0.0.1/11434
          printf 'POST /api/generate HTTP/1.0\r\nContent-Type: application/json\r\nContent-Length: %s\r\n\r\n%s' "${#body}" "$body" >&3
          head -1 <&3 || true
          exec 3>&-
          wait $pid
        env:
        - name: OLLAMA_HOST
          value: 0.0.0.0:11434
        - name: OLLAMA_MODELS
          value: /models/ollama
        - name: OLLAMA_KEEP_ALIVE
          value: "-1"
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "1"
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        # Measured 2026-10-09 on a ~7k-token prompt: flash attention is neutral
        # (~300 tok/s prompt, ~7 tok/s generation); a q8_0 KV cache saves
        # 0.6 GB but drops generation to ~6 tok/s. Since 2026-10-09 the cache is
        # q8_0 anyway: with Frigate on the Jetson the memory matters more.
        - name: OLLAMA_FLASH_ATTENTION
          value: "1"
        - name: OLLAMA_KV_CACHE_TYPE
          value: q8_0
        # llama-server (started by Ollama, which does not pass --cache-ram)
        # keeps a prompt cache in host RAM, 8 GB by default: one ~4.6k-token
        # HA request took 650 MiB on 2026-10-09. 0 turns it off; the slot still
        # reuses the common prefix of the previous request.
        - name: LLAMA_ARG_CACHE_RAM
          value: "0"
        # 8192: with house control the HA agent sends ~5k tokens (Assist tools
        # + exposed entities); 4096 made Ollama reject the request.
        - name: OLLAMA_CONTEXT_LENGTH
          value: "8192"
        # qwen3:4b-instruct (Qwen3-4B-Instruct-2507, no thinking): default for
        # the HA agent, reliable tool calls for house control. qwen2.5:3b:
        # faster fallback, weaker answers.
        - name: PULL_MODELS
          value: qwen3:4b-instruct qwen2.5:3b
        ports:
        - name: http
          containerPort: 11434
        readinessProbe:
          httpGet:
            path: /api/version
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/version
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 5Gi
        volumeMounts:
        - name: models
          mountPath: /models
          subPath: models
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: jetson-ai-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: llm
  namespace: ai
  labels:
    app: llm
spec:
  selector:
    app: llm
  ports:
  - name: http
    port: 8080
    targetPort: http
---
# LAN only, no auth. Only chat/inference endpoints are routed: the Ollama API
# also allows pulling and deleting models (/api/pull, /api/delete, ...), which
# must not be reachable from the LAN.
#   http://llm.telheira/v1/chat/completions   (OpenAI-compatible clients)
#   http://192.168.0.240                      (Home Assistant Ollama integration)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: llm
  namespace: ai
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: >-
      (Host(`llm.telheira`) || Host(`192.168.0.240`)) &&
      (PathPrefix(`/v1/`) || Path(`/api/chat`) || Path(`/api/generate`) ||
      Path(`/api/tags`) || Path(`/api/show`) || Path(`/api/version`) ||
      Path(`/api/ps`) || Path(`/`))
    services:
    - kind: Service
      name: llm
      port: 8080

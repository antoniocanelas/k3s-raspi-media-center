---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale
  labels:
    run: tailscale
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      run: tailscale
  template:
    metadata:
      labels:
        run: tailscale
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: tailscale
      nodeSelector:
        kubernetes.io/hostname: pi-master-00
      initContainers:
      - name: sysctls
        image: busybox
        securityContext:
          privileged: true
        command:
        - /bin/sh
        - -c
        - |
          sysctl -w net.ipv4.ip_forward=1
          sysctl -w net.ipv6.conf.all.forwarding=1
      containers:
      - name: tailscale
        image: ghcr.io/tailscale/tailscale:latest
        imagePullPolicy: Always
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-auth
              key: authkey
        - name: TS_STATE_DIR
          value: /var/lib/tailscale
        - name: TS_USERSPACE
          value: "false"
        # Advertise your home subnet so you can reach all local devices via Tailscale
        - name: TS_ROUTES
          value: "192.168.0.0/24"
        - name: TS_EXTRA_ARGS
          value: "--hostname=pi-master-00"
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
        volumeMounts:
        - mountPath: /var/lib/tailscale
          name: config
          subPath: tailscale
        - mountPath: /dev/net/tun
          name: tun
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: ssd-config-pvc
      - name: tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: media

labels:
- includeSelectors: true
  includeTemplates: true
  pairs:
    app: media

resources:
- namespace.yaml
- ingress-route-external.yaml
- ingress-route-homeassistant-external.yaml
- ingress-route-plex-external.yaml
- middlewares.yaml
- external-services.yaml
- nas-storage.yaml
- ssd-storage.yaml
#- transmission
- qbittorrent
- prowlarr
#- profilarr
- radarr
- sonarr
- bazarr
- tailscale
#- jackett
#- readarr
#- jellyfin
#- kavita
#- lidarr

patches:
- target:
    version: v1
    kind: Service
    name: homeassistant-external
  patch: |-
    - op: add
      path: /spec/selector
      value:
        external-backend: "true"
- target:
    version: v1
    kind: Service
    name: jellyfin-external
  patch: |-
    - op: add
      path: /spec/selector
      value:
        external-backend: "true"
- target:
    version: v1
    kind: Service
    name: plex-external
  patch: |-
    - op: add
      path: /spec/selector
      value:
        external-backend: "true"

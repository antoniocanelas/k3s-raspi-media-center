# Home Assistant runs on a separate Pi (192.168.0.100), not in this cluster.
# No selector - backed by a manually-managed EndpointSlice (endpointslice.yaml)
# instead of a pod. Fixed 2026-07-10: this Service previously had a selector
# matching zero pods, so it silently routed nowhere for ~110 days.
apiVersion: v1
kind: Service
metadata:
  name: homeassistant-external
  labels:
    app: media
spec:
  ports:
  - port: 8123
    targetPort: 8123
    name: http

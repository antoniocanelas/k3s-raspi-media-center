        - secretRef:
            name: camera-rtsp
            optional: true
        - secretRef:
            name: mqtt
            optional: true
        image: nvcr.io/nvidia/deepstream:7.1-samples-multiarch
        name: deepstream
        resources:
          limits:
            memory: 3Gi
          requests:
            cpu: 500m
            memory: 1Gi

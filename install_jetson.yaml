      host: 192.168.0.100
      port: 1883
      user: "{FRIGATE_MQTT_USER}"
      password: "{FRIGATE_MQTT_PASSWORD}"
      topic_prefix: frigate
      client_id: frigate-jetson

    # Live view in the Frigate UI: Frigate's own go2rtc restreams our go2rtc
    # (no new camera sessions). HD gets an AAC copy of the camera's PCMA audio
    # so browsers can play it.
    go2rtc:
      streams:
        cam60_hd:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@go2rtc.ai.svc.cluster.local:8554/cam60_hd
          - "ffmpeg:cam60_hd#audio=aac"
        cam60:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@go2rtc.ai.svc.cluster.local:8554/cam60
        cam62_hd:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@go2rtc.ai.svc.cluster.local:8554/cam62_hd
          - "ffmpeg:cam62_hd#audio=aac"
        cam62:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@go2rtc.ai.svc.cluster.local:8554/cam62
        cam63_hd:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@go2rtc.ai.svc.cluster.local:8554/cam63_hd
          - "ffmpeg:cam63_hd#audio=aac"
        cam63:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@go2rtc.ai.svc.cluster.local:8554/cam63

    # YOLOv7-320 TensorRT (FP16 engine), ~20 ms. ONNX models (YOLOv9) were
    # tried and discarded on 2026-10-10: slower and ~+280 MB RAM on the Jetson.

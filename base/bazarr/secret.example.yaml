apiVersion: v1
kind: Secret
metadata:
  name: bazarr-credentials
  namespace: media
type: Opaque
stringData:
  BAZARR_API_KEY: "your-random-hex-api-key"
  BAZARR_AUTH_PASSWORD: "md5-hash-of-your-password"
  BAZARR_FLASK_SECRET: "your-random-hex-flask-secret"
  OPENSUBTITLES_USER: "your@email.com"
  OPENSUBTITLES_PASS: "your-opensubtitles-password"

ports:
- name: http
  port: 32400
  protocol: TCP
---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  failurePolicy: reinstall
  valuesContent: |-
    additionalArguments:
      - "--certificatesresolvers.letsencrypt.acme.email=antoniocanelas@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

    # acme.json must survive restarts: with the chart default (emptyDir) every
    # Traefik restart re-requests all certificates, and a restart during a
    # tplinkdns DNS hiccup leaves the external endpoints with no valid cert.
    persistence:
      enabled: true
      name: data
      accessMode: ReadWriteOnce
      size: 128Mi
      path: /data
      storageClass: "local-path"

    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
              - pi-master-00

    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
      websecure:
        tls:
          enabled: true
      homeassistantsecure:
        port: 8123
        exposedPort: 8123
        expose:
          default: true
        protocol: TCP
        tls:
          enabled: true
      plexsecure:
        port: 32443
        exposedPort: 32443
        expose:
          default: true
        protocol: TCP
        tls:
          enabled: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: llm
  namespace: ai
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: Host(`llm.telheira`)
    services:
    - kind: Service
      name: llm
      port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels:
    app: media
  name: homeassistant-external
  namespace: media
spec:
  entryPoints:
  - homeassistantsecure
  routes:
  - kind: Rule
    match: Host(`telheira.tplinkdns.com`)
    priority: 1
    services:
    - kind: Service
      name: homeassistant-external
      namespace: media
      port: 8123
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels:
    app: media
  name: media
  namespace: media
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: Host(`qbittorrent.telheira`)
    priority: 1
    services:
    - kind: Service
      name: qbittorrent
      namespace: media
      port: 8080
  - kind: Rule
    match: Host(`qbittorrent.telheira`) && PathPrefix(`/prowlarr`)
    priority: 100
    services:
    - kind: Service
      name: prowlarr
      namespace: media
      port: 9696
  - kind: Rule
    match: Host(`qbittorrent.telheira`) && PathPrefix(`/radarr`)
    priority: 100
    services:
    - kind: Service
      name: radarr
      namespace: media
      port: 7878
  - kind: Rule
    match: Host(`qbittorrent.telheira`) && PathPrefix(`/sonarr`)
    priority: 100
    services:
    - kind: Service
      name: sonarr
      namespace: media
      port: 8989
  - kind: Rule
    match: Host(`qbittorrent.telheira`) && PathPrefix(`/bazarr`)
    middlewares:
    - name: redirect-bazarr-to-subdomain
      namespace: media
    priority: 200
    services:
    - kind: Service
      name: qbittorrent
      namespace: media
      port: 8080
  - kind: Rule
    match: Host(`bazarr.telheira`)
    priority: 5
    services:
    - kind: Service
      name: bazarr
      namespace: media
      port: 6767
  - kind: Rule
    match: Host(`ha.telheira`)
    priority: 5
    services:
    - kind: Service
      name: homeassistant-external
      namespace: media
      port: 8123
  - kind: Rule
    match: Host(`jellyfin.telheira`)
    priority: 5
    services:
    - kind: Service
      name: jellyfin-external
      namespace: media
      port: 8096
  - kind: Rule
    match: Host(`plex.telheira`)
    priority: 5
    services:
    - kind: Service
      name: plex-external
      namespace: media
      port: 32400
  - kind: Rule
    match: Host(`changedetection.telheira`)
    priority: 5
    services:
    - kind: Service
      name: changedetection
      namespace: media
      port: 5000
  - kind: Rule
    match: PathPrefix(`/sonarr`)
    priority: 1
    services:
    - kind: Service
      name: sonarr
      namespace: media
      port: 8989
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels:
    app: media
  name: media-external
  namespace: media
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`telheira.tplinkdns.com`) && PathPrefix(`/prowlarr`)
    priority: 200
    services:
    - kind: Service
      name: prowlarr
      namespace: media
      port: 9696
  - kind: Rule
    match: Host(`telheira.tplinkdns.com`) && PathPrefix(`/radarr`)
    priority: 200
    services:
    - kind: Service
      name: radarr
      namespace: media
      port: 7878
  - kind: Rule
    match: Host(`telheira.tplinkdns.com`) && PathPrefix(`/sonarr`)
    priority: 200
    services:
    - kind: Service
      name: sonarr
      namespace: media
      port: 8989
  - kind: Rule
    match: Host(`telheira.tplinkdns.com`) && PathPrefix(`/bazarr`)
    priority: 200
    services:
    - kind: Service
      name: bazarr
      namespace: media
      port: 6767
  - kind: Rule
    match: Host(`telheira.tplinkdns.com`) && PathPrefix(`/changedetection`)
    middlewares:
    - name: strip-changedetection
      namespace: media
    priority: 200
    services:
    - kind: Service
      name: changedetection
      namespace: media
      port: 5000
  - kind: Rule
    match: Host(`telheira.tplinkdns.com`) && PathPrefix(`/jellyfin`)
    middlewares:
    - name: jellyfin-redirect
      namespace: media
    - name: strip-jellyfin
      namespace: media
    priority: 200
    services:
    - kind: Service
      name: jellyfin-external
      namespace: media
      port: 8096
  - kind: Rule
    match: Host(`telheira.tplinkdns.com`) && PathPrefix(`/qbittorrent`)
    middlewares:
    - name: strip-qbittorrent
      namespace: media
    priority: 200
    services:
    - kind: Service
      name: qbittorrent
      namespace: media
      port: 8080
  - kind: Rule
    match: Host(`telheira.tplinkdns.com`)
    priority: 1
    services:
    - kind: Service
      name: qbittorrent
      namespace: media
      port: 8080
  tls:
    certResolver: letsencrypt
---

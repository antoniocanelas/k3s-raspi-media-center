        record: preset-record-generic-audio-aac

    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5

    # One YOLOv7 pass detects all COCO classes, so tracking more labels does
    # not cost GPU; it only adds events. Only people raise alerts (review).
    objects:
      track:
        - person
        - car
        - cat
        - dog
      filters:
        person:
          min_score: 0.5
          threshold: 0.7
        car:
          min_score: 0.5
          threshold: 0.7
        cat:
          min_score: 0.5
          threshold: 0.7
        dog:
          min_score: 0.5
          threshold: 0.7

    # Combined all-cameras view: unused, costs an encoder/output process.
    birdseye:
      enabled: false

    # Kept 30 days so the HA "Deteções" gallery covers the last month
    # (alert clips are short; the NVMe has >100 GB free).
    # Date/time drawn on snapshots only (cheap, once per snapshot). Clips are
    # stream copies; burning a timestamp in would need CPU re-encoding (no
    # NVENC on the Orin Nano), and players show the time anyway.
    snapshots:
      enabled: true
      bounding_box: true
      timestamp: true
      retain:
        default: 30

    record:
      enabled: true
      continuous:
        days: 0
      motion:
        days: 0
      alerts:
        retain:
          days: 30
      detections:
        retain:
          days: 30

    review:
      alerts:
        labels:
          - person

    # Face recognition (trial since 2026-10-09): large model (ArcFace, GPU).
    # The model stays loaded in the embeddings process; it only runs on
    # tracked persons. Enabled on Porta and Portao only (cam60 overrides).
    # Faces are trained in the Frigate UI (Face Library). Measure Jetson RAM
    # (was ~960 MB available before) and switch to model_size: small or
    # disable if memory gets tight.
    face_recognition:
      enabled: true
      model_size: large
      # Stricter since 2026-10-10: a neighbour seen from above (cap, hand over
      # the face, ~40x40 px crops) was taken for "Du" with score 1.0.
      # min_area: ignore faces smaller than ~32x32 px (default 750). It was
      # 2500 (~50x50) but at the Porta/Portão the face only faces the camera
      # while the person is still far away (~30-45 px in the 1280x720 detect
      # frame); up close they look down, so nothing was recognized nor saved
      # for training (Du, 2026-10-10 15:54). The false "Du" came from tiny
      # crops in the library, not from min_area: train only with clear faces.
      # recognition_threshold: default 0.9. min_faces: recognitions needed
      # before a name is set (default 1).
      min_area: 1000
      recognition_threshold: 0.95
      min_faces: 2

    cameras:
      cam60:
        friendly_name: Geral
        face_recognition:
          enabled: false
        # High camera looking down: real people are 0-3% of the 640x480 frame;

    #!/bin/sh
    set -e
    # RTSP login = camera login (URL-decoded user:pass of CAM1_URL), written
    # as YAML single-quoted strings ('' escapes a quote).
    yq() { awk -v s="$1" 'BEGIN {
      h = "0123456789abcdef"; o = ""
      for (i = 1; i <= length(s); i++) {
        c = substr(s, i, 1)
        if (c == "%" && i + 2 <= length(s)) {
          c = sprintf("%c", (index(h, tolower(substr(s, i+1, 1))) - 1) * 16 + index(h, tolower(substr(s, i+2, 1))) - 1)
          i += 2
        }
        if (c == "\047") c = "\047\047"
        o = o c
      }
      printf "\047%s\047", o }'; }
    cred="${CAM1_URL#*://}"; cred="${cred%%@*}"
    {
      echo 'rtsp:'
      echo '  listen: ":8554"'
      echo "  username: $(yq "${cred%%:*}")"
      echo "  password: $(yq "${cred#*:}")"
      echo 'api:'
      echo '  listen: ":1984"'
      echo 'webrtc:'
      echo '  listen: ""'
      echo 'streams:'
      for u in "$CAM1_URL" "$CAM2_URL" "$CAM3_URL"; do
        [ -n "$u" ] || continue
        h="${u##*@}"; h="${h%%[:/]*}"
        printf '  cam%s: "%s#media=video"\n' "${h##*.}" "$u"
        printf '  cam%s_hd: "%s"\n' "${h##*.}" "${u%/stream2}/stream1"
      done
    } > /tmp/go2rtc.yaml
    exec go2rtc -config /tmp/go2rtc.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: llm
  name: llm
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: llm
    spec:
      containers:
      - command:
        - bash
        - -c
        - |
          ollama serve &
          pid=$!
          until ollama list >/dev/null 2>&1; do sleep 1; done
          for m in $PULL_MODELS; do
            ollama show "$m" >/dev/null 2>&1 || ollama pull "$m"
          done
          # qwen3-jetson = qwen3:4b-instruct without mmap. On the Orin (CPU and
          # GPU share RAM) a mmapped model stays resident twice: ~4.2 GB on the
          # GPU plus ~2.5 GB of mapped file. use_mmap false saves ~1.9 GB.
          # num_gpu 99 forces every layer onto the GPU: Ollama estimates free
          # GPU memory with the page cache counted as used (Jetson unified
          # memory) and otherwise splits the model ~50/50 with the CPU.
          printf 'FROM qwen3:4b-instruct\nPARAMETER use_mmap false\nPARAMETER num_ctx 8192\nPARAMETER num_gpu 99\n' > /tmp/Modelfile.qwen3-jetson
          ollama create qwen3-jetson -f /tmp/Modelfile.qwen3-jetson
          # Load the HA agent's model right away and keep it (empty prompt =
          # load only). Plain HTTP over bash: the image has no curl, and
          # "ollama run" with an empty prompt does not load anything.
          body='{"model":"qwen3-jetson:latest","prompt":"","keep_alive":-1}'
          exec 3<>/dev/tcp/127.0.0.1/11434
          printf 'POST /api/generate HTTP/1.0\r\nContent-Type: application/json\r\nContent-Length: %s\r\n\r\n%s' "${#body}" "$body" >&3
          head -1 <&3 || true
          exec 3>&-
          wait $pid
        env:
        - name: OLLAMA_HOST
          value: 0.0.0.0:11434
        - name: OLLAMA_MODELS
          value: /models/ollama
        - name: OLLAMA_KEEP_ALIVE
          value: "-1"
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "1"
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        - name: OLLAMA_FLASH_ATTENTION
          value: "1"
        - name: OLLAMA_KV_CACHE_TYPE
          value: f16
        - name: OLLAMA_CONTEXT_LENGTH
          value: "8192"
        - name: PULL_MODELS
          value: qwen3:4b-instruct qwen2.5:3b
        image: ollama/ollama:0.35.1
        livenessProbe:
          httpGet:
            path: /api/version
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
        name: ollama
        ports:
        - containerPort: 11434
          name: http
        readinessProbe:
          httpGet:
            path: /api/version
            port: http
          periodSeconds: 10
        resources:
          limits:
            memory: 5Gi
          requests:
            cpu: 500m
            memory: 2Gi
        volumeMounts:
        - mountPath: /models
          name: models
          subPath: models
      nodeSelector:
        kubernetes.io/hostname: jetson-orin-01
      runtimeClassName: nvidia
      tolerations:
      - effect: NoSchedule
        key: workload
        operator: Equal
        value: jetson
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: jetson-ai-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: people-detector
  name: people-detector
  namespace: ai
spec:
  replicas: 0
  selector:
    matchLabels:
      app: people-detector
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: people-detector
    spec:
      containers:
      - command:
        - bash
        - /config/run.sh
        envFrom:
        - secretRef:
            name: camera-rtsp
            optional: true
        image: nvcr.io/nvidia/deepstream:7.1-samples-multiarch
        name: deepstream
        resources:
          limits:
            memory: 3Gi
          requests:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /models
          name: models
          subPath: models
      - command:
        - sh
        - -c
        - |
          set -e
          {
            echo 'listener 1883 127.0.0.1'
            echo 'allow_anonymous true'
            echo 'persistence false'
            echo 'log_dest stdout'
            echo 'log_type error'
            echo 'log_type warning'
            if [ -n "$MQTT_USER" ]; then
              echo 'connection homeassistant'
              echo "address ${MQTT_HOST:-192.168.0.100}:${MQTT_PORT:-1883}"
              echo "remote_username $MQTT_USER"
              echo "remote_password $MQTT_PASS"
              echo 'remote_clientid jetson-people-detector'
              echo 'cleansession true'
              echo 'restart_timeout 5 60'
              echo 'topic jetson/# out 0'
            fi
          } > /tmp/mosquitto.conf
          exec mosquitto -c /tmp/mosquitto.conf
        envFrom:
        - secretRef:
            name: mqtt
            optional: true
        image: eclipse-mosquitto:2.0.20
        name: mqtt-bridge
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
      initContainers:
      - command:
        - sh
        - -c
        - |
          if ls /models/deepstream/peoplenet/*.engine >/dev/null 2>&1; then exit 0; fi
          sync && echo 3 > /proc/sys/vm/drop_caches
        image: busybox:1.36
        name: drop-caches
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /models
          name: models
          subPath: models
      nodeSelector:
        kubernetes.io/hostname: jetson-orin-01
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 40
      tolerations:
      - effect: NoSchedule
        key: workload
        operator: Equal
        value: jetson
      volumes:
      - configMap:
          name: people-detector
        name: config
      - name: models
        persistentVolumeClaim:
          claimName: jetson-ai-pvc

# Copy to secret.yaml, fill in a real Tailscale auth key, and apply manually.
# Do not commit secret.yaml - it is gitignored/excluded by convention.
#
# NOTE: there is also a live `tailscale` Secret (distinct from `tailscale-auth`)
# holding tailscaled's own runtime state - that one is written by the
# container itself, not something to template/provide manually.
apiVersion: v1
kind: Secret
metadata:
  name: tailscale-auth
  namespace: media
type: Opaque
stringData:
  authkey: "tskey-auth-your-generated-key"

name: 'kustomize'
description: 'Installs yq, kustomize and kubeval into the workspace and adds them to PATH'
author: 'Stefan Prodan'
branding:
  icon: 'command'
  color: 'blue'
inputs:
  yq_version:
    description: 'The yq version to install'
    required: false
# Composite (runs on the runner) instead of a Docker action: the Docker build
# pulled stefanprodan/alpine-base from Docker Hub on every run, and a Docker
# Hub outage (504, 2026-10-09) silently stopped manifests reaching the cluster.
runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        YQ_VERSION: ${{ inputs.yq_version }}
      run: bash "${{ github.action_path }}/entrypoint.sh"

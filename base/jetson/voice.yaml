# Local voice for Home Assistant Assist on jetson-orin-01 (Wyoming protocol):
#   whisper: speech-to-text, faster-whisper small-int8, Portuguese, CPU
#   piper:   text-to-speech, voice pt_PT-tugão-medium (European Portuguese), CPU
# Both run on the CPU so they do not compete with the LLM and the video
# pipeline for the GPU. Models are downloaded once to jetson-ai-pvc
# (/var/lib/jetson-data/ai/models/voice). HA reaches them on the LAN through
# hostPorts on the Jetson: tcp://192.168.0.250:10300 (STT), :10200 (TTS).
# Wyoming has no authentication; it only converts audio and text.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice
  namespace: ai
  labels:
    app: voice
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: voice
  template:
    metadata:
      labels:
        app: voice
    spec:
      nodeSelector:
        kubernetes.io/hostname: jetson-orin-01
      tolerations:
      - key: workload
        operator: Equal
        value: jetson
        effect: NoSchedule
      containers:
      - name: whisper
        image: rhasspy/wyoming-whisper:3.8.1
        args:
        - --model
        - small-int8
        - --language
        - pt
        # beam-size 1 misheard most test phrases; 5 is the Whisper default.
        - --beam-size
        - "5"
        # House vocabulary biases recognition towards Assist commands.
        - --initial-prompt
        - "Assistente da casa em português de Portugal. Liga, desliga, abre, fecha a luz, o estore, a persiana da sala, da cozinha, do escritório, do quarto dos pais, dos meninos, das visitas, do hall, da garagem, da entrada. Temperatura, termoacumulador, carregador do carro, aquário, aspirador, lá em cima, lá em baixo."
        - --uri
        - tcp://0.0.0.0:10300
        - --data-dir
        - /data
        ports:
        - name: stt
          containerPort: 10300
          hostPort: 10300
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            memory: 1536Mi
        volumeMounts:
        - name: models
          mountPath: /data
          subPath: models/voice/whisper
      - name: piper
        image: rhasspy/wyoming-piper:2.5.2
        args:
        - --voice
        - pt_PT-tugão-medium
        - --uri
        - tcp://0.0.0.0:10200
        - --data-dir
        - /data
        ports:
        - name: tts
          containerPort: 10200
          hostPort: 10200
        resources:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: models
          mountPath: /data
          subPath: models/voice/piper
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: jetson-ai-pvc
